[workspace]
resolver = "3"
members = ["crates/*"]
# Patched third-party sources ([patch.crates-io] below) are dependencies, never members.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT"

[workspace.dependencies]
ngterm-proto = { path = "crates/ngterm-proto" }
ngterm-ghostty-vt-sys = { path = "crates/ngterm-ghostty-vt-sys" }
ngterm-ghostty-vt = { path = "crates/ngterm-ghostty-vt" }
ngterm-host = { path = "crates/ngterm-host" }
ngterm-core = { path = "crates/ngterm-core" }
ngterm-server = { path = "crates/ngterm-server" }
ngterm-session = { path = "crates/ngterm-session" }
ngterm-pty = { path = "crates/ngterm-pty" }
ngterm-app = { path = "crates/ngterm-app" }
ngterm-term = { path = "crates/ngterm-term" }
ngterm-wpe-javascriptcore-sys = { path = "crates/ngterm-wpe-javascriptcore-sys" }
ngterm-wpe-platform-sys = { path = "crates/ngterm-wpe-platform-sys" }
ngterm-wpe-sys = { path = "crates/ngterm-wpe-sys" }
ngterm-wpe = { path = "crates/ngterm-wpe" }
async-channel = "2"
base64 = "0.23"
bitflags = "2"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
# A page-serve channel's MIME types by file extension (ngterm-core's `remote/page_serve.rs`), the standard crate.
mime_guess = "2.0.5"
# Windows APIs, features per crate: ngterm-session's endpoint (the named pipe's security descriptor and its
# server-process check), its job and process tables.
windows-sys = "0.61"
# macOS system sounds by name for the status sounds (ngterm-gpui's `status_sound.rs`), features per crate: the AppKit
# and Foundation bindings of the objc2 project, and the runtime crate for the retained sound the player keeps, the
# versions GPUI's macOS backend already links.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
# The UTF-16 strings interprocess takes a named pipe's security descriptor in (ngterm-session, Windows).
widestring = "1.2"
# ngterm-session's server start from inside a Windows job that refuses breakaway: WMI's `Win32_Process.Create`, as
# herdr starts its server (docs/spikes/20261018-session-server.md). No chrono or time: no WMI dates are read.
wmi = { version = "0.18.4", default-features = false }
# ngterm-wpe's worker transport (socket pairs, SCM_RIGHTS, memfds), the version wayland and calloop already link.
rustix = "1.1"
# `default-features = false` drops the `html` renderer and the CLI's `getopts`: the HUD walks the events itself.
pulldown-cmark = { version = "0.13", default-features = false }
# Kitty graphics PNG transmissions, decoded for libghostty-vt's process-global PNG hook (ngterm-term).
png = "0.18"
# ngterm-core's installed identity inside a macOS app bundle, its `Contents/Info.plist` (`identity.rs`), read as
# upstream reads it.
plist = { version = "1.10", default-features = false }
# A pane's PTY and child (ngterm-term), as Zed and WezTerm use it.
portable-pty = "0.9"
# ngterm-gpui's link detection: Ghostty's default URL and path matcher (`link-url`) over the terminal's rows, whose
# look-arounds (Oniguruma's, in Ghostty) need a backtracking engine; fancy-regex is the regex crate's own one.
fancy-regex = "0.19"
serde = { version = "1", features = ["derive"] }
# ngterm-session's wire (docs/spikes/20261018-session-server.md: in place of herdr's bincode, whose last release
# is a tombstone). `use-std` without the default `heapless-cas`: messages own their buffers.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
# ngterm-session's endpoint, as herdr's: a Unix domain socket, a named pipe on Windows.
interprocess = "2.4"
# `preserve_order`: a result built as a `Value` keeps its fields in upstream's order on the wire (the catalog's
# `fields` order) instead of sorting them.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
serde_with = { version = "3", default-features = false, features = ["macros"] }
strum = { version = "0.27", features = ["derive"] }
serde_norway = "0.9"
tempfile = "3"
thiserror = "2"
# Parsing only: the agent hooks installer reads Codex's `config.toml` before appending to it.
toml = { version = "1.1", default-features = false, features = ["parse", "std", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Unicode full case folding: ghostty's keybind character triggers compare folded.
unicase = "2.10"
unicode-normalization = "0.1"
# Extended grapheme clusters: the ask field's byte cap cuts between user-perceived characters, as Swift's do.
unicode-segmentation = "1.13"
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
# ngterm-wpe's build script asks the pkg-config the link used where WPE WebKit lives (scripts/pkg-config.sh).
pkg-config = "0.3"
# The GLib and libsoup -sys crates the gir-generated WPE WebKit bindings (ngterm-wpe*-sys) build on: the gtk-rs 0.22
# family, and soup3-sys under the name gir gives it.
glib-sys = "0.22"
gobject-sys = "0.22"
gio-sys = "0.22"
soup-sys = { package = "soup3-sys", version = "0.9" }
# The safe GLib/Gio over the same -sys crates, for ngterm-wpe: its engine thread's main context and loop, the
# GObject subclasses of WPEPlatform's display, view and toplevel, signals and streams. The gtk-rs 0.22 family of the
# -sys crates above, so one GLib binding is linked.
glib = "0.22"
gio = "0.22"
# The GPUI frontend (ngterm-gpui): Zed's GPUI through gpui-kit, which pins the `gpui-pre` snapshot it re-exports
# (`=0.3.9`, wgpu 29.0.4). Default features: its components and assets, never `gpui-fast` (longbridge's own backend).
gpui-kit = "=0.7.3"
# ngterm-gpui's tests measure a real font through GPUI's Linux text system (`CosmicTextSystem`), the crate gpui-kit
# already links at the version its `gpui-pre` pins.
gpui-pre-wgpu = "=0.3.9"
# ngterm-gpui reads the native key behind a key event (`current_native_input`, a patch of ours) from GPUI's Linux
# platform, the crate gpui-kit already links.
gpui-pre-linux = { version = "=0.3.9", default-features = false }
# ngterm-gpui's procedural sprites (box drawing, blocks, powerline, braille) fill and stroke their paths with it, as
# Ghostty's sprite font does with z2d. No PNG codec (`png-format`): the sprites only rasterize.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# ngterm-gpui's text watermarks: the text shaped and rasterized off screen with the cosmic-text GPUI's Linux text system
# already links (its default features: system fonts through fontconfig, swash rasterization), written as a PNG.
cosmic-text = "0.19"
# ngterm-gpui's terminal images: the `image` buffers GPUI's `RenderImage` is made of (Kitty graphics), and the
# `background-image` file decoded as Ghostty reads it (PNG or JPEG only). The version GPUI already links.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# ngterm-gpui's single instance: GApplication's own D-Bus protocol (`org.gtk.Application`, `org.gtk.Actions`) on the
# app id's bus name, so a second launch forwards to the running one;
# its desktop notifications, banners on the freedesktop notification server posted, clicked (with the server's
# activation token) and withdrawn on one connection.
zbus = "5.19"
# ngterm-gpui's sidebar: the folder chooser of Open Directory… (a title and a starting folder, which GPUI's own
# `prompt_for_paths` does not take) and the desktop's `enable-animations` setting the status glyph's blink obeys, through
# the xdg-desktop-portal crate GPUI's Linux platform already links (0.13, `async-io`; no tokio). `raw_handle` and
# `wayland` name the chooser's parent window from GPUI's raw window handle (an X11 id, an `xdg-foreign` export).
# `global_shortcuts`: keymap.conf's `global-hotkey` on Wayland, through the desktop's global shortcuts portal.
ashpd = { version = "0.13", default-features = false, features = [
    "async-io",
    "file_chooser",
    "global_shortcuts",
    "settings",
    "raw_handle",
    "wayland",
] }
# The `StreamExt` the portal's setting-changed stream and the notification server's signals are read with (the futures family zbus and ashpd link).
futures-util = "0.3"
# ngterm-gpui activates its window with a token another launch handed over, on GPUI's own connection: xdg-activation
# on the Wayland display (the wayland-rs family GPUI links), `_NET_ACTIVE_WINDOW` on X11 (the x11rb major GPUI links).
raw-window-handle = "0.6"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
x11rb = "0.13.2"
# ngterm-gpui's SIGTERM quit on a thread of its own (GPUI installs no signal handling).
signal-hook = "0.4"
# ngterm-gpui's watch on `remotes.conf`: the platform's recommended watcher, inotify on Linux, FSEvents on macOS,
# ReadDirectoryChangesW on Windows. The version the lock already carries.
notify = "8.2"
# ngterm-gpui's last network source on Linux, as gio's netlink `NetworkMonitor` (GLib's fallback without
# NetworkManager): the kernel's default routes over rtnetlink, the rust-netlink crates' blocking socket and their
# route messages.
netlink-sys = { version = "0.9", default-features = false }
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"

# Inherited by every crate (`[lints] workspace = true`) except the generated -sys crates: `ngterm-ghostty-vt-sys`
# (bindgen), `ngterm-wpe-sys`, `ngterm-wpe-platform-sys` and `ngterm-wpe-javascriptcore-sys`
# (gir). Only a reasoned outer `#[expect(..., reason = "...")]` on the one item can lift a lint: `#[allow]` is refused.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# complexity (thresholds in clippy.toml)
cognitive_complexity = "deny"
too_many_lines = "deny"
excessive_nesting = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
# robustness
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# FFI
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# exceptions
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# calloop (GPUI's Linux event loop) without its unconditional request for tracing's `log` feature, which workspace
# feature unification spread to every crate and clippy's cognitive_complexity then counted in every tracing macro:
# vendor/calloop is the verified crates.io source plus build/patches/calloop (scripts/vendor-calloop.sh;
# scripts/check-tracing-features.sh keeps the feature out of the graph).
[patch.crates-io]
calloop = { path = "vendor/calloop" }
# GPUI patch 1 (docs/plans/20261014-gpui-frontend.md, Technical Details > GPUI patches): external surfaces on Linux,
# dmabufs imported zero-copy into the renderer's Vulkan device (ngterm-gpui's external_texture). vendor/gpui-pre and
# vendor/gpui-pre-wgpu are the verified crates.io sources plus build/patches/gpui-pre{,-wgpu} (scripts/vendor-gpui.sh).
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
# Task 14: the native key behind each key event GPUI dispatches on Wayland and X11 (its XKB keycode, layout character
# and modifiers, which GPUI's `Keystroke` drops), for the terminal's physical-key bindings and the Kitty keyboard
# protocol: vendor/gpui-pre-linux is the verified crates.io source plus build/patches/gpui-pre-linux.
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
# ngterm-pty's PTY and child: vendor/portable-pty is the verified crates.io source plus build/patches/portable-pty
# (scripts/vendor-portable-pty.sh): ConPTY from kernel32 only, herdr's Windows environment and PATH fixes, a child
# spawned into its job, and a ConPTY session's handles exported and imported for the session server's update handoff.
portable-pty = { path = "vendor/portable-pty" }
