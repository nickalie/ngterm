[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agterm-conformance"
version = "0.1.0"
description = "Black-box conformance suite for agterm implementations"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-rerunfailures>=14.0",
    "pyyaml>=6.0",
    # the Windows stand-in for `ssh` in tests/cli/test_cli_only.py: an .exe launcher over a Python script
    "distlib>=0.3.8; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The macOS ui driver (agterm_conformance.drivers.ax).
ax = [
    "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

[project.entry-points.pytest11]
agterm_conformance = "agterm_conformance.plugin"

[tool.setuptools.packages.find]
include = ["agterm_conformance*"]

[tool.pytest.ini_options]
addopts = ["-p", "pytester", "--strict-markers"]
testpaths = ["selftests", "tests"]
