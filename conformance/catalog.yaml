exemptions:
  debug.appearance: refused outside UI-test mode; a UI-test-only hook with no CLI subcommand
  zmx.attach: a successful attach re-discovers the remote over ssh before creating anything, which the suite's no-network,
    no-remote-host constraints exclude; its refusals are still tested
  behavior:zmx.tree.remote-host: remote discovery runs ssh, excluded by the suite's no-network constraints
  behavior:companion.remote-create: a companion of a row attached from another machine is created on that machine over ssh
    and attached here, which needs zmx.attach over ssh, excluded by the suite's no-network constraints; the origin side is
    tested through the companion commands and zmx.tree
  behavior:companion.remote-page: the viewer side of a remote page companion (session.companion.page.attach over ssh and
    its page channel) needs zmx.attach over ssh, excluded by the suite's no-network constraints; the origin's listing of
    the page row is tested through zmx.tree
  behavior:zmx.present.respawn-reattach: the viewer's reattach of a held pane its origin respawned needs zmx.attach over
    ssh, excluded by the suite's no-network constraints; the origin's pane.respawn is tested through zmx.present
  session.paste: a successful paste reads the desktop's own clipboard, which an isolated GUI instance shares with the user's
    session and which no test may seed without overwriting the user's; its refusals are still tested
  session.overlay.copy: no protocol command makes a selection inside an overlay terminal (session.selectall acts on the panes
    underneath); its refusals are still tested
  zmx.reset: a confirmed reset quits the app and relaunches it through `open -n` outside the harness (LiveResetRelauncher),
    a process the harness may neither start nor stop. Its --force refusal is still tested
  field:result.liveReset: written only by a confirmed zmx.reset, exempted above
  field:tree.liveReset: reports a reset zmx.reset armed or a launch consumed, exempted above
  field:tree.session.remoteHost: set only on a session attached from another machine, which needs zmx.attach over ssh, excluded
    by the suite's no-network constraints
  field:tree.session.presentation: the viewer side of an attached session's presentation stream, which needs zmx.attach over
    ssh; the origin side is tested through zmx.present
  event:remote.opened: emitted when a session attached over ssh opens, excluded with zmx.attach
  event:remote.closed: emitted when a session attached over ssh closes, excluded with zmx.attach
  cli:session paste: a successful paste reads the desktop clipboard, exempted with session.paste; its refusals are still tested
  cli:session overlay copy: no command makes a selection inside an overlay terminal, exempted with session.overlay.copy; its
    refusals are still tested
  cli:zmx reset: a confirmed reset quits the app and relaunches it outside the harness, exempted with zmx.reset; its --force
    refusal is still tested
  cli:zmx attach: a successful attach runs ssh, exempted with zmx.attach; its refusals are still tested
  ui:palette-subtitle: never exposed by the reference, since its row's `palette-item-{item}` identifier overrides those of
    the row's texts; the pick test accepts the subtitle under either id, but no reference exercises this one
  ui:palette-badge: never exposed by the reference, for the reason given for ui:palette-subtitle
  ui:remote-reconnect-note-{pane}: shows what ssh said when probing the remote host of an attached session failed, which needs
    zmx.attach over ssh, excluded by the suite's no-network constraints
