exemptions:
  debug.appearance: refused outside UI-test mode; a UI-test-only hook with no CLI subcommand
  live.attach: a successful attach re-discovers the remote over ssh before creating anything, which the suite's no-network,
    no-remote-host constraints exclude; its refusals are still tested
  field:result.remoteGroup: a group attach receipt requires successful parent attachment over ssh, excluded with live.attach;
    request validation is covered without networking and receipt behavior is tested with Rust fake runners in Task 5
  behavior:live.tree.remote-host: remote discovery runs ssh, excluded by the suite's no-network constraints
  behavior:companion.remote-create: a companion of a row attached from another machine is created on that machine over ssh
    and attached here, which needs live.attach over ssh, excluded by the suite's no-network constraints; the origin side is
    tested through the companion commands and live.tree
  behavior:companion.remote-page: the viewer side of a remote page companion (session.companion.page.attach over ssh and its
    page channel) needs live.attach over ssh, excluded by the suite's no-network constraints; the origin's listing of the
    page row is tested through live.tree
  behavior:live.present.respawn-reattach: the viewer's reattach of a held pane its origin respawned needs live.attach over
    ssh, excluded by the suite's no-network constraints; the origin's pane.respawn is tested through live.present
  session.paste: a successful paste reads the desktop's own clipboard, which an isolated GUI instance shares with the user's
    session and which no test may seed without overwriting the user's; its refusals are still tested
  session.overlay.copy: no protocol command makes a selection inside an overlay terminal (session.selectall acts on the panes
    underneath); its refusals are still tested
  live.reset: a confirmed reset quits the app and relaunches it through `open -n` outside the harness (LiveResetRelauncher),
    a process the harness may neither start nor stop. Its --force refusal is still tested
  field:result.liveReset: written only by a confirmed live.reset, exempted above
  field:tree.liveReset: reports a reset live.reset armed or a launch consumed, exempted above
  field:tree.session.remoteHost: set only on a session attached from another machine, which needs live.attach over ssh, excluded
    by the suite's no-network constraints
  field:tree.session.presentation: the viewer side of an attached session's presentation stream, which needs live.attach over
    ssh; the origin side is tested through live.present
  event:remote.opened: emitted when a session attached over ssh opens, excluded with live.attach
  event:remote.closed: emitted when a session attached over ssh closes, excluded with live.attach
  cli:session paste: a successful paste reads the desktop clipboard, exempted with session.paste; its refusals are still tested
  cli:session overlay copy: no command makes a selection inside an overlay terminal, exempted with session.overlay.copy; its
    refusals are still tested
  cli:live reset: a confirmed reset quits the app and relaunches it outside the harness, exempted with live.reset; its --force
    refusal is still tested
  cli:live attach: a successful attach runs ssh, exempted with live.attach; its refusals are still tested
  ui:palette-subtitle: never exposed by the reference, since its row's `palette-item-{item}` identifier overrides those of
    the row's texts; the pick test accepts the subtitle under either id, but no reference exercises this one
  ui:palette-badge: never exposed by the reference, for the reason given for ui:palette-subtitle
  ui:palette-mark: never exposed by the reference, for the reason given for ui:palette-subtitle (a membership editor row's
    flag or focus mark); the ui test of the session editor reads its toggle back from the tree instead
  ui:remote-reconnect-note-{pane}: shows what ssh said when probing the remote host of an attached session failed, which needs
    live.attach over ssh, excluded by the suite's no-network constraints
