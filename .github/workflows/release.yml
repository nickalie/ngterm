# The desktop release: build, package and publish ngterm for Linux (x86_64, aarch64), Windows (x86_64) and macOS
# (Intel, Apple Silicon). scripts/release-version.py, in the `version` job, decides what a run does:
#
# - publishing: a `v*` tag push, or a dispatch with `publish: true` on a tag ref
#   (`gh workflow run release --ref vX.Y.Z -f publish=true`). It builds every platform, waits for the `approve` job,
#   whose `release-gate` environment needs the release reviewer (scripts/setup-release-protection.sh), then publishes
#   the GitHub release;
# - a dry run: a dispatch with `publish: false` on any ref. It builds the platforms its `platforms` input names, at
#   that ref's Cargo.toml version, keeps the packages as workflow artifacts and publishes nothing.
#
# Every action is pinned by commit SHA (its tag in a comment, which Dependabot keeps current), and no checkout keeps
# its credentials.
name: release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Releases (only on a vMAJOR.MINOR.PATCH tag ref; otherwise a dry run)"
        default: false
        type: boolean
      platforms:
        description: "A dry run's platforms: all, or some of linux, macos, windows, android (publishing builds all)"
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
      publishing: ${{ steps.version.outputs.publishing }}
      signing_mode: ${{ steps.version.outputs.signing_mode }}
      require_minisign: ${{ steps.version.outputs.require_minisign }}
      require_developer_id: ${{ steps.version.outputs.require_developer_id }}
      platforms: ${{ steps.version.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Self-test
        run: python3 scripts/release-version.py --self-test
      - name: Version, publishing, signing mode and platforms
        id: version
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
          NGTERM_RELEASE_SIGNING: ${{ vars.NGTERM_RELEASE_SIGNING }}
        run: python3 scripts/release-version.py

  # The one approval of a release, at its start: every job that signs or publishes needs it. Its environment holds no
  # secrets.
  approve:
    needs: version
    if: needs.version.outputs.publishing == 'true'
    runs-on: ubuntu-24.04
    environment: release-gate
    steps:
      - name: Approved
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
        run: echo "release $RELEASE_TAG at $RELEASE_COMMIT approved"

  linux:
    needs: version
    if: contains(fromJSON(needs.version.outputs.platforms), 'linux')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    # A cold WPE source build dominates this job. Its installed prefix is cached.
    timeout-minutes: 350
    env:
      NGTERM_RELEASE_WPE: /home/runner/.cache/ngterm/release-wpe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - name: Build and packaging dependencies
        run: |
          # WPE and the Rust release build both need disk space on hosted runners.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 lld-18 cmake ninja-build pkg-config ruby perl python3 gperf \
            curl xz-utils patch zstd file patchelf desktop-file-utils \
            bubblewrap xdg-dbus-proxy apparmor dbus-daemon libseccomp-dev libfontconfig-dev libfreetype-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libglib2.0-dev libharfbuzz-dev libharfbuzz-icu0 libicu-dev libjpeg-dev \
            libepoxy-dev libgcrypt20-dev libsoup-3.0-dev libtasn1-6-dev libxml2-dev \
            libpng-dev libsqlite3-dev libwebp-dev zlib1g-dev libavif-dev liblcms2-dev \
            libjxl-dev libwoff-dev libxslt1-dev libinput-dev libudev-dev libdrm-dev \
            libgbm-dev libegl-dev libgles-dev libatk1.0-dev libatk-bridge2.0-dev \
            libhyphen-dev libenchant-2-dev flite1-dev libmanette-0.2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav glib-networking libvulkan1 mesa-vulkan-drivers
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.os }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ngterm/vendor
          key: release-vendor-${{ matrix.os }}-${{ hashFiles('build/pins.env', 'build/patches/ghostty-vt/**', 'scripts/lib/native.sh') }}
      - name: WPE cache identity
        id: wpe-cache
        run: |
          key="$(scripts/build-release-wpe.sh --print-key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ngterm/release-wpe
          key: release-wpe-${{ matrix.os }}-${{ steps.wpe-cache.outputs.key }}
      - name: Portable WPE WebKit
        run: scripts/build-release-wpe.sh
      - name: libghostty-vt and embedded fonts
        run: |
          scripts/build-ghostty-vt.sh
          scripts/fetch-fonts.sh
      - name: Release binaries with HTML overlays
        env:
          PKG_CONFIG_PATH: ${{ env.NGTERM_RELEASE_WPE }}/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ env.NGTERM_RELEASE_WPE }}/lib
        run: |
          cargo test --locked -p ngterm-update
          cargo build --locked --release -p ngterm-gpui -p ngterm-ctl -p ngterm-session -p ngterm-headless
          scripts/stage.sh "$RUNNER_TEMP/stage" --profile release
          cargo test --locked --release -p ngterm-wpe --test headless --no-run --message-format=json > "$RUNNER_TEMP/wpe-test.json"
          python3 - "$RUNNER_TEMP/wpe-test.json" >> "$GITHUB_ENV" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as source:
              artifacts = [json.loads(line) for line in source]
          binaries = [a["executable"] for a in artifacts if a.get("reason") == "compiler-artifact"
                      and a["target"]["name"] == "headless" and a.get("executable")]
          if len(binaries) != 1:
              raise SystemExit("expected one WPE headless test executable")
          print(f"NGTERM_WPE_SMOKE_BINARY={binaries[0]}")
          PY
      - name: Linux archive, native packages and AppImage
        run: scripts/package-release.sh "$RUNNER_TEMP/stage" "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows-build:
    needs: version
    if: contains(fromJSON(needs.version.outputs.platforms), 'windows')
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-windows-2025
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ngterm/vendor
          key: release-vendor-windows-2025-${{ hashFiles('build/pins.env', 'build/patches/ghostty-vt/**', 'scripts/lib/native.sh') }}
      - name: libghostty-vt and embedded fonts
        run: |
          scripts/build-ghostty-vt.sh
          scripts/fetch-fonts.sh
      - name: Release binaries with HTML overlays
        run: |
          cargo test --locked -p ngterm-update
          cargo build --locked --release -p ngterm-gpui -p ngterm-ctl -p ngterm-session -p ngterm-headless
      - name: Stage and package
        run: |
          scripts/stage.sh "$RUNNER_TEMP/stage" --profile release
          scripts/package-release.sh "$RUNNER_TEMP/stage" "${{ needs.version.outputs.version }}" dist
      - name: Validate Windows install, upgrade and uninstall
        run: |
          IFS=. read -r major minor patch <<<"${{ needs.version.outputs.version }}"
          scripts/build-msi.sh "$RUNNER_TEMP/upgrade.msi" --staged "$RUNNER_TEMP/stage" --version "$major.$minor.$((patch + 1))"
      - name: Windows installer smoke test
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi).FullName
          scripts\check-msi.ps1 -Msi $msi -UpgradeMsi "$env:RUNNER_TEMP\upgrade.msi" -Log "$env:RUNNER_TEMP\msi"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x86_64
          path: dist/*
          if-no-files-found: error

  macos-build:
    needs: version
    if: contains(fromJSON(needs.version.outputs.platforms), 'macos')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.os }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ngterm/vendor
          key: release-vendor-${{ matrix.os }}-${{ hashFiles('build/pins.env', 'build/patches/ghostty-vt/**', 'scripts/lib/native.sh') }}
      - name: libghostty-vt and embedded fonts
        run: |
          scripts/build-ghostty-vt.sh
          scripts/fetch-fonts.sh
      - name: Release binaries with HTML overlays
        run: |
          cargo test --locked -p ngterm-update
          cargo build --locked --release -p ngterm-gpui -p ngterm-ctl -p ngterm-session -p ngterm-headless
      - name: Stage and package
        run: |
          scripts/stage.sh "$RUNNER_TEMP/stage" --profile release
          scripts/package-release.sh "$RUNNER_TEMP/stage" "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, approve, linux, windows-build, macos-build]
    if: needs.version.outputs.publishing == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          # Upload into a draft first: failed uploads never expose a partial new release.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "ngterm $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --clobber -- *
          gh release edit "$RELEASE_TAG" --draft=false
