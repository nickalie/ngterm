# The release: build, package and publish ngterm for Linux (x86_64, aarch64), Windows (x86_64) and macOS (Intel, Apple
# Silicon), and the iOS app as an unsigned IPA (TestFlight and the App Store get the signed one from ios-release.yml).
# scripts/release-version.py, in the `version` job, decides what a run does:
#
# - publishing: a `v*` tag push, or a dispatch with `publish: true` on a tag ref
#   (`gh workflow run release --ref vX.Y.Z -f publish=true`). It builds every platform, waits for the `approve` job,
#   whose `release-gate` environment needs the release reviewer (scripts/setup-release-protection.sh), then publishes
#   the GitHub release;
# - a rehearsal: a dispatch with `rehearse: true` on a tag ref (`gh workflow run release --ref vX.Y.Z -f
#   rehearse=true`). It waits for the same approval and signs exactly as a release does, with the `release`
#   environment's credentials, but publishes nothing: the packages stay workflow artifacts. It builds the platforms its
#   `platforms` input names, so one platform's credentials can be checked alone;
# - a dry run: a dispatch with neither, on any ref. It builds the platforms its `platforms` input names, at that ref's
#   Cargo.toml version, signs with throwaway keys only, keeps the packages as workflow artifacts and publishes nothing.
#
# A signed run is publishing or a rehearsal: only a signed run reaches the `release` environment.
#
# The jobs, in order: build (no secrets, caches allowed), sign (no cache, and it executes nothing a build produced),
# verify (runs the signed output), `checksums`, then `publish`. Files pass between them as artifacts, checked by
# digest at every step (scripts/release-artifacts.py): each job that uploads reports the artifact's id, its files'
# SHA-256 and which of them are release assets in a job output (matrix legs under per-arch names, as legs writing one
# name overwrite each other), and each job that downloads checks what it got against those before using it. A tree a
# later job unpacks travels as a tarball, so modes and symlinks survive; finished packages travel as plain files.
#
# Every action is pinned by commit SHA (its tag in a comment, which Dependabot keeps current), and no checkout keeps
# its credentials.
name: release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Releases (only on a vMAJOR.MINOR.PATCH tag ref; otherwise a dry run or rehearsal)"
        default: false
        type: boolean
      rehearse:
        description: "Rehearse: sign as a release does, with the real credentials, and publish nothing (tag refs only)"
        default: false
        type: boolean
      platforms:
        description: "A dry run's or rehearsal's platforms: all, or some of linux, macos, windows, android, ios (publishing builds all)"
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      build_commit: ${{ steps.version.outputs.build_commit }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
      publishing: ${{ steps.version.outputs.publishing }}
      rehearsal: ${{ steps.version.outputs.rehearsal }}
      signed_run: ${{ steps.version.outputs.signed_run }}
      signing_mode: ${{ steps.version.outputs.signing_mode }}
      require_minisign: ${{ steps.version.outputs.require_minisign }}
      require_developer_id: ${{ steps.version.outputs.require_developer_id }}
      platforms: ${{ steps.version.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Self-test
        run: python3 scripts/release-version.py --self-test
      - name: Version, publishing, rehearsal, signing mode and platforms
        id: version
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_REHEARSE: ${{ inputs.rehearse }}
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
          NGTERM_RELEASE_SIGNING: ${{ vars.NGTERM_RELEASE_SIGNING }}
        run: python3 scripts/release-version.py

  # The one approval of a signed run (a release or a rehearsal), at its start: every job that signs or publishes needs
  # it. Its environment holds no secrets.
  approve:
    needs: version
    if: needs.version.outputs.signed_run == 'true'
    runs-on: ubuntu-24.04
    environment: release-gate
    steps:
      - name: Approved
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
          REHEARSAL: ${{ needs.version.outputs.rehearsal }}
        run: |
          kind=release
          [[ "$REHEARSAL" != true ]] || kind="rehearsal of"
          echo "$kind $RELEASE_TAG at $RELEASE_COMMIT approved"

  linux:
    needs: version
    if: contains(fromJSON(needs.version.outputs.platforms), 'linux')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    outputs:
      manifest_x86_64: ${{ steps.manifest.outputs.manifest_x86_64 }}
      manifest_aarch64: ${{ steps.manifest.outputs.manifest_aarch64 }}
    # A cold WPE source build dominates this job. Its installed prefix is cached.
    timeout-minutes: 350
    env:
      NGTERM_RELEASE_WPE: /home/runner/.cache/ngterm/release-wpe
      NGTERM_BUILD_COMMIT: ${{ needs.version.outputs.build_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - name: Build and packaging dependencies
        run: |
          # WPE and the Rust release build both need disk space on hosted runners.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 lld-18 cmake ninja-build pkg-config ruby perl python3 gperf \
            curl xz-utils patch zstd file patchelf desktop-file-utils \
            bubblewrap xdg-dbus-proxy apparmor dbus-daemon libseccomp-dev libfontconfig-dev libfreetype-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libglib2.0-dev libharfbuzz-dev libharfbuzz-icu0 libicu-dev libjpeg-dev \
            libepoxy-dev libgcrypt20-dev libsoup-3.0-dev libtasn1-6-dev libxml2-dev \
            libpng-dev libsqlite3-dev libwebp-dev zlib1g-dev libavif-dev liblcms2-dev \
            libjxl-dev libwoff-dev libxslt1-dev libinput-dev libudev-dev libdrm-dev \
            libgbm-dev libegl-dev libgles-dev libatk1.0-dev libatk-bridge2.0-dev \
            libhyphen-dev libenchant-2-dev flite1-dev libmanette-0.2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav glib-networking libvulkan1 mesa-vulkan-drivers
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.os }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ngterm/vendor
          key: release-vendor-${{ matrix.os }}-${{ hashFiles('build/pins.env', 'build/patches/ghostty-vt/**', 'scripts/lib/native.sh') }}
      - name: WPE cache identity
        id: wpe-cache
        run: |
          key="$(scripts/build-release-wpe.sh --print-key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ngterm/release-wpe
          key: release-wpe-${{ matrix.os }}-${{ steps.wpe-cache.outputs.key }}
      - name: Portable WPE WebKit
        run: scripts/build-release-wpe.sh
      - name: libghostty-vt and embedded fonts
        run: |
          scripts/build-ghostty-vt.sh
          scripts/fetch-fonts.sh
      - name: Release binaries with HTML overlays
        env:
          PKG_CONFIG_PATH: ${{ env.NGTERM_RELEASE_WPE }}/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ env.NGTERM_RELEASE_WPE }}/lib
        run: |
          cargo test --locked -p ngterm-update
          cargo build --locked --release -p ngterm-gpui -p ngterm-ctl -p ngterm-session -p ngterm-headless
          scripts/stage.sh "$RUNNER_TEMP/stage" --profile release
          cargo test --locked --release -p ngterm-wpe --test headless --no-run --message-format=json > "$RUNNER_TEMP/wpe-test.json"
          python3 - "$RUNNER_TEMP/wpe-test.json" >> "$GITHUB_ENV" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as source:
              artifacts = [json.loads(line) for line in source]
          binaries = [a["executable"] for a in artifacts if a.get("reason") == "compiler-artifact"
                      and a["target"]["name"] == "headless" and a.get("executable")]
          if len(binaries) != 1:
              raise SystemExit("expected one WPE headless test executable")
          print(f"NGTERM_WPE_SMOKE_BINARY={binaries[0]}")
          PY
      - name: Linux archive, native packages and AppImage
        run: scripts/package-release.sh "$RUNNER_TEMP/stage" "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - name: Manifest
        id: manifest
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARCH: ${{ matrix.arch }}
        run: |
          manifest="$(python3 scripts/release-artifacts.py manifest dist "$ARTIFACT_ID")"
          echo "manifest_$ARCH=$manifest" >> "$GITHUB_OUTPUT"

  windows-build:
    needs: version
    if: contains(fromJSON(needs.version.outputs.platforms), 'windows')
    runs-on: windows-2025
    timeout-minutes: 90
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
    env:
      NGTERM_BUILD_COMMIT: ${{ needs.version.outputs.build_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-windows-2025
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ngterm/vendor
          key: release-vendor-windows-2025-${{ hashFiles('build/pins.env', 'build/patches/ghostty-vt/**', 'scripts/lib/native.sh') }}
      - name: libghostty-vt and embedded fonts
        run: |
          scripts/build-ghostty-vt.sh
          scripts/fetch-fonts.sh
      - name: Release binaries with HTML overlays
        run: |
          cargo test --locked -p ngterm-update
          cargo build --locked --release -p ngterm-gpui -p ngterm-ctl -p ngterm-session -p ngterm-headless
      # Unsigned, as plain files: SignPath opens this artifact itself, and reads no tarball.
      - name: MSI, portable zip and the upgrade-test MSI
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          scripts/stage.sh "$RUNNER_TEMP/stage" --profile release
          scripts/package-release.sh "$RUNNER_TEMP/stage" "$VERSION" dist
          IFS=. read -r major minor patch <<<"$VERSION"
          scripts/build-msi.sh dist/ngterm-upgrade-test.msi --staged "$RUNNER_TEMP/stage" \
            --version "$major.$minor.$((patch + 1))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-windows-x86_64
          path: dist/*
          if-no-files-found: error
      - name: Manifest
        id: manifest
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          manifest="$(python scripts/release-artifacts.py manifest dist "$ARTIFACT_ID" --not-asset ngterm-upgrade-test.msi)"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

  windows-verify:
    needs: [version, windows-build]
    if: ${{ !cancelled() && needs.windows-build.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - name: Artifact ids
        id: ids
        env:
          WINDOWS: ${{ needs.windows-build.outputs.manifest }}
        run: |
          ids="$(python scripts/release-artifacts.py ids "$WINDOWS")"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.ids.outputs.ids }}
          path: ${{ runner.temp }}/in
          merge-multiple: true
      - name: Digests and build identity
        env:
          WINDOWS: ${{ needs.windows-build.outputs.manifest }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_COMMIT: ${{ needs.version.outputs.build_commit }}
        run: |
          python scripts/release-artifacts.py check "$RUNNER_TEMP/in" "$WINDOWS"
          python -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
            "$RUNNER_TEMP/in/ngterm-$VERSION-windows-x86_64.zip" "$RUNNER_TEMP/zip"
          identity="$("$RUNNER_TEMP/zip/ngterm/bin/ngterm.exe" --build-identity | tr -d '\r')"
          [[ "$identity" == "$VERSION"$'\n'"$BUILD_COMMIT" ]] || { echo "::error::the zip's ngterm is $identity"; exit 1; }
      - name: Install, upgrade and uninstall
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          scripts\check-msi.ps1 -Msi "$env:RUNNER_TEMP\in\ngterm-$env:VERSION-windows-x86_64.msi" `
            -UpgradeMsi "$env:RUNNER_TEMP\in\ngterm-upgrade-test.msi" -Log "$env:RUNNER_TEMP\msi"

  macos-build:
    needs: version
    if: contains(fromJSON(needs.version.outputs.platforms), 'macos')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    outputs:
      manifest_x86_64: ${{ steps.manifest.outputs.manifest_x86_64 }}
      manifest_arm64: ${{ steps.manifest.outputs.manifest_arm64 }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      NGTERM_BUILD_COMMIT: ${{ needs.version.outputs.build_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.os }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ngterm/vendor
          key: release-vendor-${{ matrix.os }}-${{ hashFiles('build/pins.env', 'build/patches/ghostty-vt/**', 'scripts/lib/native.sh') }}
      - name: libghostty-vt and embedded fonts
        run: |
          scripts/build-ghostty-vt.sh
          scripts/fetch-fonts.sh
      - name: Release binaries with HTML overlays
        run: |
          cargo test --locked -p ngterm-update
          cargo build --locked --release -p ngterm-gpui -p ngterm-ctl -p ngterm-session -p ngterm-headless
      # The ad-hoc signed .app and the archive's loose tree, as one tarball: macos-sign packages them
      - name: Bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          scripts/stage.sh "$RUNNER_TEMP/stage" --profile release
          scripts/package-release.sh --macos-bundle "$RUNNER_TEMP/stage" "$VERSION" "$NGTERM_BUILD_COMMIT" "$RUNNER_TEMP/tree"
          mkdir dist
          COPYFILE_DISABLE=1 tar --no-xattrs -C "$RUNNER_TEMP/tree" -czf "dist/ngterm-macos-$ARCH-build.tar.gz" ngterm.app archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: build-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - name: Manifest
        id: manifest
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARCH: ${{ matrix.arch }}
        run: |
          manifest="$(python3 scripts/release-artifacts.py manifest dist "$ARTIFACT_ID" --not-asset "ngterm-macos-$ARCH-build.tar.gz")"
          echo "manifest_$ARCH=$manifest" >> "$GITHUB_OUTPUT"

  # Packages both arches. It runs nothing the builds produced: they reach it as data only (unpacked with no link out of
  # the tree), so a build can't aim it at anything this job holds.
  macos-sign:
    needs: [version, approve, macos-build]
    # A skipped `approve` passes on a dry run only
    if: >-
      ${{ !cancelled() && needs.macos-build.result == 'success'
      && (needs.approve.result == 'success'
      || (needs.version.outputs.signed_run != 'true' && needs.approve.result == 'skipped')) }}
    runs-on: macos-15
    environment: ${{ needs.version.outputs.signed_run == 'true' && 'release' || '' }}
    # notarization: two rounds of submissions, each waited for up to 90 minutes
    timeout-minutes: 240
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
      identity: ${{ steps.identity.outputs.identity }}
    env:
      X86_64: ${{ needs.macos-build.outputs.manifest_x86_64 }}
      ARM64: ${{ needs.macos-build.outputs.manifest_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      # tarfile's extraction filters
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Artifact ids
        id: ids
        run: |
          ids="$(python3 scripts/release-artifacts.py ids "$X86_64" "$ARM64")"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.ids.outputs.ids }}
          path: ${{ runner.temp }}/in
          merge-multiple: true
      - name: Digests and unpacking
        run: |
          python3 scripts/release-artifacts.py check "$RUNNER_TEMP/in" "$X86_64" "$ARM64"
          for arch in x86_64 arm64; do
            python3 scripts/release-artifacts.py extract "$RUNNER_TEMP/in/ngterm-macos-$arch-build.tar.gz" "$RUNNER_TEMP/tree-$arch"
          done
      # A dry run signs with a throwaway identity; a signed run (a release or a rehearsal) with Developer ID when the
      # secrets are there, else (in `optional` mode, with no committed team id) it ships the builds' ad-hoc signatures
      - name: Signing identity
        id: identity
        env:
          SIGNED_RUN: ${{ needs.version.outputs.signed_run }}
          SIGNING_MODE: ${{ needs.version.outputs.signing_mode }}
          REQUIRE_DEVELOPER_ID: ${{ needs.version.outputs.require_developer_id }}
          HAS_APPLE_DEVELOPER_ID_APP_P12: ${{ secrets.APPLE_DEVELOPER_ID_APP_P12 != '' }}
          HAS_APPLE_DEVELOPER_ID_INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12 != '' }}
          HAS_APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD != '' }}
          HAS_APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 != '' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [[ "$SIGNED_RUN" != true ]]; then
            identity=throwaway
          else
            missing=()
            for secret in APPLE_DEVELOPER_ID_APP_P12 APPLE_DEVELOPER_ID_INSTALLER_P12 APPLE_P12_PASSWORD APPLE_NOTARY_KEY_P8; do
              has="HAS_$secret"
              [[ "${!has}" == true ]] || missing+=("secret $secret")
            done
            for variable in APPLE_TEAM_ID APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
              [[ -n "${!variable}" ]] || missing+=("variable $variable")
            done
            if ((${#missing[@]} == 0)); then
              identity=developer-id
              committed="$(tr -d '[:space:]' < crates/ngterm-update/trust/apple-team-id)"
              if [[ -n "$committed" && "$committed" != "$APPLE_TEAM_ID" ]]; then
                echo "::error::APPLE_TEAM_ID is $APPLE_TEAM_ID, but the updater trusts team $committed (trust/apple-team-id)"
                exit 1
              fi
            elif [[ "$SIGNING_MODE" == required || "$REQUIRE_DEVELOPER_ID" == true ]]; then
              echo "::error::Developer ID signing is required; the release environment lacks: ${missing[*]}"
              exit 1
            else
              echo "::notice::macOS ships ad-hoc signed: the release environment lacks ${missing[*]}"
              identity=ad-hoc
            fi
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Sign, notarize and package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IDENTITY: ${{ steps.identity.outputs.identity }}
          APPLE_DEVELOPER_ID_APP_P12: ${{ secrets.APPLE_DEVELOPER_ID_APP_P12 }}
          APPLE_DEVELOPER_ID_INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          scripts/sign-macos.sh package "$VERSION" dist --identity "$IDENTITY" \
            "$RUNNER_TEMP/tree-x86_64" x86_64 "$RUNNER_TEMP/tree-arm64" arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error
      - name: Manifest
        id: manifest
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          manifest="$(python3 scripts/release-artifacts.py manifest dist "$ARTIFACT_ID")"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

  macos-verify:
    needs: [version, macos-sign]
    if: ${{ !cancelled() && needs.macos-sign.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MACOS: ${{ needs.macos-sign.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - name: Artifact ids
        id: ids
        run: |
          ids="$(python3 scripts/release-artifacts.py ids "$MACOS")"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.ids.outputs.ids }}
          path: ${{ runner.temp }}/in
          merge-multiple: true
      - name: Digests, signatures, layout and build identity
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_COMMIT: ${{ needs.version.outputs.build_commit }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/release-artifacts.py check "$RUNNER_TEMP/in" "$MACOS"
          name="$RUNNER_TEMP/in/ngterm-$VERSION-macos-$ARCH"
          work="$RUNNER_TEMP/verify"
          expected="$VERSION"$'\n'"$BUILD_COMMIT"
          identity() {
            local got
            got="$("$1" --build-identity)"
            [[ "$got" == "$expected" ]] || { echo "::error::$1 is $got, expected $expected"; exit 1; }
          }
          # the hardened runtime on every Mach-O, entitlements on ngterm alone and exactly the shipping set
          bundle() {
            codesign --verify --deep --strict "$1"
            scripts/sign-macos.sh check "$1"
            [[ "$(plutil -extract CFBundleShortVersionString raw "$1/Contents/Info.plist")" == "$VERSION" ]]
            [[ "$(plutil -extract GitCommit raw "$1/Contents/Info.plist")" == "$BUILD_COMMIT" ]]
            identity "$1/Contents/MacOS/ngterm"
          }
          mkdir -p "$work/zip" "$work/archive" "$work/dmg"
          ditto -x -k "$name.app.zip" "$work/zip"
          bundle "$work/zip/ngterm.app"
          tar -xzf "$name.tar.gz" -C "$work/archive"
          scripts/sign-macos.sh check "$work/archive/bin"
          identity "$work/archive/bin/ngterm"
          hdiutil attach -nobrowse -readonly -mountpoint "$work/dmg" "$name.dmg"
          trap 'hdiutil detach "$work/dmg" || true' EXIT
          bundle "$work/dmg/ngterm.app"
          # through a file: under pipefail, grep -q quitting early could fail pkgutil with SIGPIPE
          pkgutil --payload-files "$name.pkg" > "$work/pkg-files"
          grep -q 'Contents/MacOS/ngterm' "$work/pkg-files"
      # What signed them: Developer ID passes Gatekeeper and carries stapled tickets; a throwaway identity, untrusted
      # here, is matched by name; ad-hoc leaves the DMG and PKG unsigned
      - name: Signatures of the ${{ needs.macos-sign.outputs.identity }} identity
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          IDENTITY: ${{ needs.macos-sign.outputs.identity }}
        run: |
          name="$RUNNER_TEMP/in/ngterm-$VERSION-macos-$ARCH"
          app="$RUNNER_TEMP/verify/zip/ngterm.app"
          pkgutil --check-signature "$name.pkg" > "$RUNNER_TEMP/pkg-signature" && pkg_status=0 || pkg_status=$?
          cat "$RUNNER_TEMP/pkg-signature"
          case "$IDENTITY" in
            developer-id) signer="Developer ID Application: " ;;
            throwaway) signer="ngterm throwaway Developer ID Application" ;;
            ad-hoc) signer=adhoc ;;
            *)
              echo "::error::unknown identity '$IDENTITY'"
              exit 1
              ;;
          esac
          # every Mach-O of the app and of the archive, by that signer
          mkdir "$RUNNER_TEMP/signer-archive"
          tar -xzf "$name.tar.gz" -C "$RUNNER_TEMP/signer-archive"
          scripts/sign-macos.sh check "$app" --signer "$signer"
          scripts/sign-macos.sh check "$RUNNER_TEMP/signer-archive/bin" --signer "$signer"
          if [[ "$IDENTITY" != ad-hoc ]]; then
            dmg="$(codesign -dvv "$name.dmg" 2>&1)"
            [[ $'\n'"$dmg" == *$'\nAuthority='"$signer"* ]] || { echo "::error::the DMG's signer: $dmg"; exit 1; }
          fi
          case "$IDENTITY" in
            developer-id)
              spctl --assess --type execute -vv "$app"
              spctl --assess --type open --context context:primary-signature -vv "$name.dmg"
              spctl --assess --type install -vv "$name.pkg"
              ((pkg_status == 0)) || { echo "::error::pkgutil --check-signature failed ($pkg_status)"; exit 1; }
              grep -q 'Developer ID Installer: ' "$RUNNER_TEMP/pkg-signature"
              for file in "$app" "$name.dmg" "$name.pkg"; do xcrun stapler validate "$file"; done
              ;;
            throwaway)
              # untrusted on this runner, so pkgutil's verdict is not the check: its signer is
              grep -q 'ngterm throwaway Developer ID Installer' "$RUNNER_TEMP/pkg-signature"
              ;;
          esac

  # The iOS app as an unsigned IPA: the unsigned Release archive of scripts/build-ios.sh (the same checks as an
  # ios-release.yml dry run), its app zipped under Payload/. It installs only once re-signed; the signed app goes
  # through TestFlight and the App Store. No secrets: the archive is unsigned because none of the App Store Connect
  # variables is set here.
  ios-build:
    needs: version
    if: contains(fromJSON(needs.version.outputs.platforms), 'ios')
    runs-on: xcode-27
    # the core for both iOS targets, the bindings and a Release build of the app, as ios-release.yml allows it
    timeout-minutes: 120
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          # the build number is the commit count
          fetch-depth: 0
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      # ios.yml's caches, read only, as ios-release.yml reads them
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ios
          save-if: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ngterm/vendor
          key: vendor-ngterm-xcode-27-${{ runner.arch }}-${{ hashFiles('build/pins.env', 'build/patches/ghostty-vt/**', 'scripts/lib/native.sh', 'scripts/setup-ios.sh') }}
      - name: libghostty-vt and the iOS toolchain
        run: |
          scripts/build-ghostty-vt.sh
          scripts/setup-ios.sh
      - name: Unsigned Release archive, checked
        run: scripts/build-ios.sh archive
      - name: IPA
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          app=mobile/ios/build/NgTerm.xcarchive/Products/Applications/NgTerm.app
          marketing="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Info.plist")"
          build="$(plutil -extract CFBundleVersion raw -o - "$app/Info.plist")"
          [[ "$marketing" == "$VERSION" ]] || { echo "::error::the app's version is $marketing, not $VERSION"; exit 1; }
          [[ "$build" =~ ^[0-9]+$ ]] || { echo "::error::the app's build number is '$build'"; exit 1; }
          if codesign -dv "$app" 2>/dev/null; then
            echo "::error::$app is signed: this job has no credentials and ships an unsigned IPA"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/NgTerm.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry -X "$GITHUB_WORKSPACE/dist/ngterm-$VERSION-ios-unsigned.ipa" Payload)
          echo "ngterm $VERSION (build $build): ngterm-$VERSION-ios-unsigned.ipa" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-ios
          path: dist/*
          if-no-files-found: error
      - name: Manifest
        id: manifest
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          manifest="$(python3 scripts/release-artifacts.py manifest dist "$ARTIFACT_ID")"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

  checksums:
    needs: [version, linux, windows-build, macos-sign, ios-build]
    # Over what this run built: a dry run's or rehearsal's left-out platforms are skipped, and any failure stops it, a
    # job cancelled past its timeout included
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (needs.linux.result == 'success' || needs.windows-build.result == 'success'
      || needs.macos-sign.result == 'success' || needs.ios-build.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
    env:
      LINUX_X86_64: ${{ needs.linux.outputs.manifest_x86_64 }}
      LINUX_AARCH64: ${{ needs.linux.outputs.manifest_aarch64 }}
      WINDOWS: ${{ needs.windows-build.outputs.manifest }}
      MACOS: ${{ needs.macos-sign.outputs.manifest }}
      IOS: ${{ needs.ios-build.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - name: Artifact ids
        id: ids
        run: |
          ids="$(python3 scripts/release-artifacts.py ids "$LINUX_X86_64" "$LINUX_AARCH64" "$WINDOWS" "$MACOS" "$IOS")"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.ids.outputs.ids }}
          path: ${{ runner.temp }}/in
          merge-multiple: true
      - name: SHA256SUMS over the release assets
        run: |
          mkdir sums
          python3 scripts/release-artifacts.py sums "$RUNNER_TEMP/in" "$LINUX_X86_64" "$LINUX_AARCH64" "$WINDOWS" "$MACOS" "$IOS" \
            > sums/SHA256SUMS
          cat sums/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-sha256sums
          path: sums/SHA256SUMS
          if-no-files-found: error
      - name: Manifest
        id: manifest
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          manifest="$(python3 scripts/release-artifacts.py manifest sums "$ARTIFACT_ID")"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
      # A dry run holds no secrets, so `publish` never runs: the signing step runs here instead, with a key made for
      # this run, and its signature is thrown away
      - name: SHA256SUMS signature with a throwaway key
        if: needs.version.outputs.signed_run != 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sudo apt-get update -q && sudo apt-get install -yq minisign
          scripts/sign-sums.sh --throwaway sums/SHA256SUMS "$VERSION"

  # A release: the minisign signature over SHA256SUMS, the build attestations, then the GitHub release. A rehearsal
  # stops after the signature, so the key is checked before a real release; it attests and uploads nothing.
  publish:
    needs: [version, approve, linux, windows-build, windows-verify, macos-sign, macos-verify, ios-build, checksums]
    # Publishing needs every job to succeed. A rehearsal may build a subset of platforms, so there a skipped job is
    # accepted; a failed or cancelled one (a job past its timeout ends cancelled, not failed) never is
    if: >-
      ${{ !cancelled() && needs.version.outputs.signed_run == 'true' && needs.approve.result == 'success'
      && needs.checksums.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && (needs.version.outputs.publishing != 'true' || !contains(needs.*.result, 'skipped')) }}
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      LINUX_X86_64: ${{ needs.linux.outputs.manifest_x86_64 }}
      LINUX_AARCH64: ${{ needs.linux.outputs.manifest_aarch64 }}
      WINDOWS: ${{ needs.windows-build.outputs.manifest }}
      MACOS: ${{ needs.macos-sign.outputs.manifest }}
      IOS: ${{ needs.ios-build.outputs.manifest }}
      SUMS: ${{ needs.checksums.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      # A publishing run builds every platform: an empty manifest is a job that failed to report, never one left out. A
      # rehearsal's left-out platforms have none
      - name: Artifact ids
        id: ids
        env:
          PUBLISHING: ${{ needs.version.outputs.publishing }}
        run: |
          [[ -n "$SUMS" ]] || { echo "::error::no SUMS manifest"; exit 1; }
          if [[ "$PUBLISHING" == true ]]; then
            for manifest in LINUX_X86_64 LINUX_AARCH64 WINDOWS MACOS IOS; do
              [[ -n "${!manifest}" ]] || { echo "::error::no $manifest manifest"; exit 1; }
            done
          fi
          ids="$(python3 scripts/release-artifacts.py ids "$LINUX_X86_64" "$LINUX_AARCH64" "$WINDOWS" "$MACOS" "$IOS" "$SUMS")"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.ids.outputs.ids }}
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Digests
        run: |
          python3 scripts/release-artifacts.py check "$RUNNER_TEMP/dist" \
            "$LINUX_X86_64" "$LINUX_AARCH64" "$WINDOWS" "$MACOS" "$IOS" "$SUMS"
          (cd "$RUNNER_TEMP/dist" && sha256sum --check --strict SHA256SUMS)
      # With the key: sign, then verify against the committed trust/minisign.pub. Without it: a non-empty
      # minisign.pub (which installed builds then require) or `required` mode fails; otherwise a notice, and the
      # release has no .minisig
      - name: SHA256SUMS signature
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGNING_MODE: ${{ needs.version.outputs.signing_mode }}
          REQUIRE_MINISIGN: ${{ needs.version.outputs.require_minisign }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [[ -z "$MINISIGN_SECRET_KEY" ]]; then
            if [[ "$REQUIRE_MINISIGN" == true || "$SIGNING_MODE" == required ]]; then
              echo "::error::the SHA256SUMS signature is required; the release environment lacks secret MINISIGN_SECRET_KEY"
              exit 1
            fi
            echo "::notice::SHA256SUMS ships unsigned: the release environment lacks secret MINISIGN_SECRET_KEY"
            exit 0
          fi
          sudo apt-get update -q && sudo apt-get install -yq minisign
          scripts/sign-sums.sh "$RUNNER_TEMP/dist/SHA256SUMS" "$VERSION"
      # Every release asset (the lines of SHA256SUMS, checked above), SHA256SUMS and its signature
      - name: Attestation subjects
        if: needs.version.outputs.publishing == 'true'
        run: |
          cp "$RUNNER_TEMP/dist/SHA256SUMS" "$RUNNER_TEMP/attested"
          subjects=(SHA256SUMS)
          [[ ! -f "$RUNNER_TEMP/dist/SHA256SUMS.minisig" ]] || subjects+=(SHA256SUMS.minisig)
          (cd "$RUNNER_TEMP/dist" && sha256sum -- "${subjects[@]}") >> "$RUNNER_TEMP/attested"
          cat "$RUNNER_TEMP/attested"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.version.outputs.publishing == 'true'
        with:
          subject-checksums: ${{ runner.temp }}/attested
      - name: GitHub Release
        if: needs.version.outputs.publishing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          mapfile -t assets < <(python3 scripts/release-artifacts.py assets "$LINUX_X86_64" "$LINUX_AARCH64" "$WINDOWS" "$MACOS" "$IOS")
          cd "$RUNNER_TEMP/dist"
          # Upload into a draft first: failed uploads never expose a partial new release.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "ngterm $RELEASE_TAG" --generate-notes
          fi
          signature=()
          [[ ! -f SHA256SUMS.minisig ]] || signature=(SHA256SUMS.minisig)
          gh release upload "$RELEASE_TAG" --clobber -- "${assets[@]}" SHA256SUMS "${signature[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
