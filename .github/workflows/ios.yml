# The iOS app (mobile/ios) over the mobile core (crates/ngterm-mobile), on GitHub's `xcode-27` image, whose Xcode 27.2
# and iOS 27.0 simulator runtime are the build/pins.env pins (the image's default Xcode is 27.1: scripts/setup-ios.sh
# finds /Applications/Xcode_27.2.app and exports it as DEVELOPER_DIR, which scripts/build-ios.sh takes from it). The
# core's own Rust checks on the hosts are cross-platform.yml's; this workflow runs what only Xcode can.
#
# The core is built once, by `core`, and the jobs that need it wait for that and then run side by side (one after
# another they took two hours; measured on main, 2026-11-14: the core 7 to 28 min, the lint's analyzer 33 to 39 min,
# the Unit plan 20 to 25 min, the UI plan 21 to 27 min on the phone and 30 to 53 min on the tablet):
#
# - `core`: scripts/build-ios.sh --no-xcode, the core for both iOS targets, its Swift bindings and XCFramework, handed
#   to the jobs below as the `ios-core` artifact, which they build over with --prebuilt-core: none of them compiles
#   Rust. The artifact is kept for the 30 days in which a failed job can be run again, since such a rerun leaves
#   `core` as it was. Main keeps them in a cache too, keyed by everything they are built from (the crates and the
#   WSL launcher ngterm-core embeds, the workspace's pins, toolchain and cargo config, the libghostty-vt pins and
#   patches, the scripts that build them), so a run over the same sources builds nothing;
# - `core-tests`: the core's Rust tests on the phone simulator (ngterm-mobile's unit tests and ngterm-ghostty-vt's
#   tests, through scripts/ios-sim-runner.sh). It needs no XCFramework, so it starts with `core`;
# - `lint`: scripts/build-ios.sh lint: SwiftLint with its analyzer rules, swift-format, the suppression reasons, Swift
#   6 with warnings as errors. Its build log is kept as `ios-lint-log` when it fails;
# - `unit`: scripts/build-ios.sh coverage, the Unit test plan on both simulators and its line coverage, over both
#   simulators' profiles, checked against the floors of mobile/ios/coverage-floors.txt; the coverage summary
#   (Unit.coverage.txt and .json) is kept as `ios-coverage` on every run that wrote it;
# - `ui`: the UI test plan, in the suite that the trigger selects (see "Suites" below). The full suite is
#   scripts/build-ios.sh ui, a job per simulator, and the tablet's, the slower, in two shares of the test classes
#   (--ui-shard, which makes the shares the whole plan). The smoke suite is scripts/build-ios.sh smoke, the smoke set
#   of the plan (build-ios.sh's UI_SMOKE_TESTS), a job per simulator: a fresh simulator's first minutes start tens of
#   widget and wallpaper extensions of 230-400 MB each, and the tablet's, after the phone's run on the same runner,
#   took the 7 GB Mac to 13% free memory, 1 GB of swap and a 220-244 s stall, and the runner lost its job (main run
#   45143684401, both attempts). In each suite,
#   a UI test that fails runs once more, and each that passed on its retry is named with what failed it: a warning
#   when XCTest gave up on the app, as it now and then does on these virtual Macs, and otherwise a flaky test that
#   fails the job (build-ios.sh's report_retried_tests);
# - `results`: when a `unit` or `ui` job fails (or runs out of time, or retried a test:
#   mobile/ios/build/retried-tests.txt) its result bundles are kept, and the failed snapshots' images
#   (mobile/ios/build/snapshot-failures/) with the failed tests' attachments exported from the result bundles (each
#   snapshot's reference, failure and difference images, the UI audits' screenshots), and the Mac's load samples with
#   the runner's own log (mobile/ios/build/host-diagnostics/: scripts/ci-host-monitor.sh). This job gathers what those
#   jobs kept into `ios-results` and `ios-failure-diffs`, a directory per job (the jobs' own `ios-results-*` and
#   `ios-failure-diffs-*` last a day);
# - `archive`: scripts/build-ios.sh archive, an unsigned Release archive for devices, checked to hold no
#   NgtermCoreFakes symbol (the fake core is for Debug builds only), to answer the export compliance question, and to
#   carry a privacy manifest that covers the required-reason APIs its binary uses (scripts/ios-privacy-check.sh). The
#   signed archive, its export and its upload are ios-release.yml's.
#
# Every job that builds sets up the same way: the pinned Zig and the libghostty-vt prefix (scripts/build-ghostty-vt.sh,
# which setup-ios.sh then finds), then the iOS toolchain (scripts/setup-ios.sh: the Rust iOS targets, the phone and
# tablet simulators, SwiftLint). The simulator runtimes of the image are mounted for minutes after the Mac starts, and
# until then the pinned runtime and the simulators on it can disappear: setup-ios.sh waits for them, and each test run
# readies its simulators right before it starts (setup-ios.sh --simulator: made again when gone, booted, with a time
# limit on the boot), after the plan's build (build-ios.sh builds before any simulator boots). `unit` and
# `ui` end with their tests counted per simulator, so the split can be checked against `scripts/build-ios.sh test`,
# which runs both plans whole.
#
# The vendor root (the pinned Zig, its global cache, the libghostty-vt prefixes and the vendored SwiftLint) and cargo's
# registry and target directory are cached as cross-platform.yml's macOS leg caches them, under keys of this image;
# both are `core`'s to save (the other jobs read them). Only main saves caches: a branch's would crowd main's out of
# the repository's cache space. The simulator runtime is the image's; Xcode's derived data is not cached.
#
# Suites. The UI legs are the longest jobs and the most fragile ones on these 3-CPU runners, so they run in two suites:
#
# - smoke: a push and a pull request. All the other jobs run as in the full suite, so the lint, the build, the Unit
#   plan and its coverage floors are per push;
# - full: the nightly run on main (the schedule below), a run by hand (`gh workflow run ios --ref main`: its `suite`
#   input is `full` unless it is set to `smoke`), and the release (release.yml calls this workflow with `suite:
#   full` and publishes only when it passes).
#
# The coverage floors come from the Unit plan alone (the `unit` job), so the two suites check the same floors. A run of
# one suite does not cancel a run of the other suite on the same ref: a push to main does not stop the nightly run.
# Because the release runs this workflow, its actions are pinned by commit SHA (the tag in a comment) and no checkout
# keeps its credentials, as in release.yml.
#
# Path-filtered to what the app builds from: the mobile core and the crates it builds on, the workspace manifest, lock
# file, toolchain and cargo config, mobile/ios/ and the fonts it shares with Android, the scripts, patches and pins of
# its toolchain, and this file. Pushes to a `ci/**` branch run it too. The schedule, a run by hand and the release's call
# have no path filter.
name: ios

on:
  pull_request:
    paths: &paths
      # the mobile core and its build closure (`cargo tree -p ngterm-mobile`)
      - crates/ngterm-mobile/**
      - crates/ngterm-term/**
      - crates/ngterm-core/**
      - crates/ngterm-host/**
      - crates/ngterm-proto/**
      - crates/ngterm-ghostty-vt/**
      - crates/ngterm-ghostty-vt-sys/**
      # the workspace's dependency pins, toolchain and cargo config
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - mobile/ios/**
      # the mono fonts build-ios.sh copies from their one source, the Android app's
      - mobile/android/app/src/main/res/font/**
      - scripts/build-ios.sh
      - scripts/setup-ios.sh
      - scripts/ios-sim-runner.sh
      - scripts/ios-privacy-check.sh
      - scripts/ios-coverage.py
      - scripts/build-ghostty-vt.sh
      - scripts/lib/native.sh
      - scripts/ci-rust-toolchain.sh
      - build/pins.env
      - build/patches/ghostty-vt/**
      - .github/workflows/ios.yml
  push:
    branches: [main, "ci/**"]
    paths: *paths
  # the full suite each night on main, at 03:17 UTC: GitHub delays scheduled runs at the start of an hour the most
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "The UI tests to run: full (the whole UI plan on the phone and the tablet) or smoke (the smoke set)"
        default: full
        type: choice
        options: [full, smoke]
  workflow_call:
    inputs:
      suite:
        description: "The UI tests to run: full or smoke"
        default: full
        type: string

permissions:
  contents: read

# Separate each caller workflow and suite, so a manual run cannot cancel the release.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.suite == 'full') && 'full' || 'smoke' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  core:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      # no job needs the token after the checkout: it does not stay in the clone (release.yml calls this workflow, and no
      # checkout of a release keeps its credentials)
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # every crate, not only the core's build closure: ngterm-mobile embeds a file of a crate outside it. And the WSL
      # shell integration: ngterm-core embeds its launcher
      - name: the core a run on main built from these inputs
        id: built
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &core-cache
          path: |
            mobile/ios/Packages/NgtermCore/Generated/NgtermCoreFFI.xcframework
            mobile/ios/Packages/NgtermCore/Generated/NgtermCoreBindings
          key: ios-core-xcode-27-${{ hashFiles('crates/**', 'resources/shell-integration/wsl/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'build/pins.env', 'build/patches/ghostty-vt/**', 'scripts/build-ios.sh', 'scripts/setup-ios.sh', 'scripts/build-ghostty-vt.sh', 'scripts/lib/native.sh') }}
      # the vendor root, keyed like cross-platform.yml's legs', with the iOS setup that installs SwiftLint into it and
      # the library's builds for the device and the simulator. This job alone saves it, in the build below, which a
      # saved core skips: so on main a saved core is built again when the vendor root of its inputs is not saved (its
      # save failed or was cancelled, or the entry was deleted), else no later run would save it
      - name: the vendor root a run on main saved for these inputs
        id: vendor-saved
        if: steps.built.outputs.cache-hit == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &vendor-path |
            ~/.cache/ngterm/vendor/*
            !~/.cache/ngterm/vendor/zig-cache-*
            ~/.cache/ngterm/vendor/zig-cache-*/p
          key: &vendor-key vendor-ngterm-xcode-27-${{ runner.arch }}-${{ hashFiles('build/pins.env', 'build/patches/ghostty-vt/**', 'scripts/lib/native.sh', 'scripts/setup-ios.sh', 'crates/ngterm-ghostty-vt-sys/zig_build.rs', 'crates/ngterm-ghostty-vt-sys/build.rs', 'crates/ngterm-ghostty-vt-sys/lib_store.rs', 'crates/ngterm-ghostty-vt-sys/sdk.rs', 'crates/ngterm-ghostty-vt-sys/windows_sdk.ps1', '.cargo/config.toml') }}
          lookup-only: true
      - name: whether this job builds the core
        id: build
        run: >-
          echo "core=${{ steps.built.outputs.cache-hit != 'true' || (github.ref == 'refs/heads/main' &&
          steps.vendor-saved.outputs.cache-hit != 'true') }}" >> "$GITHUB_OUTPUT"
      - name: rust toolchain (rust-toolchain.toml), the only one installed
        if: steps.build.outputs.core == 'true'
        run: scripts/ci-rust-toolchain.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.build.outputs.core == 'true'
        with:
          shared-key: ios
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.build.outputs.core == 'true' && github.ref == 'refs/heads/main'
        with: &vendor
          path: *vendor-path
          key: *vendor-key
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.build.outputs.core == 'true' && github.ref != 'refs/heads/main'
        with: *vendor
      - name: Zig and the libghostty-vt prefix (build/pins.env)
        if: steps.build.outputs.core == 'true'
        run: scripts/build-ghostty-vt.sh
      - name: iOS toolchain (build/pins.env)
        if: steps.build.outputs.core == 'true'
        run: scripts/setup-ios.sh
      - name: the core for both iOS targets, its Swift bindings and XCFramework
        if: steps.build.outputs.core == 'true'
        run: scripts/build-ios.sh --no-xcode
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.built.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with: *core-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-core
          path: |
            mobile/ios/Packages/NgtermCore/Generated/NgtermCoreFFI.xcframework
            mobile/ios/Packages/NgtermCore/Generated/NgtermCoreBindings
          if-no-files-found: error
          # as long as "re-run failed jobs" is offered: that rerun skips this job and needs its artifact
          retention-days: 30

  core-tests:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - *checkout
      - name: rust toolchain (rust-toolchain.toml), the only one installed
        run: scripts/ci-rust-toolchain.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ios
          save-if: false
      # the core job's vendor root, read only
      - &vendor-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *vendor
      - &ghostty-vt
        name: Zig and the libghostty-vt prefix (build/pins.env)
        run: scripts/build-ghostty-vt.sh
      - &ios-toolchain
        name: iOS toolchain (build/pins.env)
        run: scripts/setup-ios.sh
      - name: the core's Rust tests on the iOS simulator
        run: |
          eval "$(scripts/setup-ios.sh --check)"
          export CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUNNER="$PWD/scripts/ios-sim-runner.sh"
          cargo test -p ngterm-mobile --lib --target aarch64-apple-ios-sim
          cargo test -p ngterm-ghostty-vt --target aarch64-apple-ios-sim

  lint:
    needs: core
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - *checkout
      - &rust-toolchain
        name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - *vendor-restore
      - *ghostty-vt
      - *ios-toolchain
      - &prebuilt-core
        name: the core (the core job's)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-core
          path: mobile/ios/Packages/NgtermCore/Generated
      - name: lint (SwiftLint and its analyzer rules, swift-format, the suppression reasons)
        run: scripts/build-ios.sh --prebuilt-core lint
      - name: upload the lint's build log
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-lint-log
          path: mobile/ios/build/lint-analyze.log
          if-no-files-found: ignore

  unit:
    needs: core
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      LEG: unit
    steps:
      - *checkout
      - *rust-toolchain
      - *vendor-restore
      - *ghostty-vt
      - *ios-toolchain
      - *prebuilt-core
      # the Mac's load every 10 s while the tests run (scripts/ci-host-monitor.sh), kept with the runner's own log when
      # the job fails or is cancelled (keep the runner's log, below). The runner kills it with the job's leftovers
      - &host-monitor
        name: sample the Mac's load in the background
        run: nohup scripts/ci-host-monitor.sh mobile/ios/build/host-diagnostics/load.log </dev/null >/dev/null 2>&1 &
      - name: the Unit test plan on the phone and tablet, its coverage floors
        run: scripts/build-ios.sh --prebuilt-core coverage
      - name: upload the coverage summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-coverage
          path: mobile/ios/build/Unit.coverage.*
          if-no-files-found: ignore
      - &upload-results
        name: upload the result bundles
        if: failure() || cancelled() || hashFiles('mobile/ios/build/retried-tests.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-results-${{ env.LEG }}
          path: mobile/ios/build/*.xcresult
          if-no-files-found: ignore
          retention-days: 1
      # the failed tests' attachments out of the result bundles, so they can be looked at without Xcode: a snapshot's
      # reference, failure and difference images, a UI test's audit screenshots, each plan's manifest.json naming them.
      # A passing test keeps none, so everything is exported: `--only-failures` would miss the snapshots' images,
      # which Swift Testing records beside the issue rather than on it
      - &export-attachments
        name: export the failed tests' attachments
        if: failure() || cancelled() || hashFiles('mobile/ios/build/retried-tests.txt') != ''
        run: |
          eval "$(scripts/setup-ios.sh --check)"
          for bundle in mobile/ios/build/*.xcresult; do
            [[ -d "$bundle" ]] || continue
            xcrun xcresulttool export attachments --path "$bundle" \
              --output-path "mobile/ios/build/failure-attachments/$(basename "$bundle" .xcresult)" || true
          done
      # the runner's own log (its Runner_*.log in _diag, beside bin/Runner.Worker), which names what ended a cancelled
      # job: a cancel from the service, a shutdown, or the job's lease it failed to renew. Runner v2.338.2 cancels a job
      # on the first renewal that fails after the first one has passed (its run-service RenewJobRequestAsync reads a
      # `request` it never sets), and its renewals, a minute apart, have taken up to 142 s while the tablet simulator
      # started: such a failure shows only as "The operation was canceled" mid-test. Its renewal and cancel lines are
      # printed here too
      - &runner-log
        name: keep the runner's log beside the load samples
        if: failure() || cancelled() || hashFiles('mobile/ios/build/retried-tests.txt') != ''
        run: |
          # awk reads ps to the end: an early exit would leave ps writing to a closed pipe, and pipefail would fail the
          # step on its SIGPIPE
          worker="$(ps -axo command= | awk '$1 ~ /\/bin\/Runner\.Worker$/ && w == "" { w = $1 } END { print w }')"
          [[ -n "$worker" ]] || { echo "no Runner.Worker process to find the runner's _diag by"; exit 0; }
          mkdir -p mobile/ios/build/host-diagnostics
          cp "$(dirname "$(dirname "$worker")")"/_diag/Runner_*.log mobile/ios/build/host-diagnostics/ || true
          grep -hE 'renew|[Cc]ancel|Abandon|[Ee]xception|[Ss]hutdown' mobile/ios/build/host-diagnostics/Runner_*.log |
            grep -v 'Successfully renew' || true
      # what the simulator service did: the runtime disk images and simulators as simctl lists them now, and the log of
      # the processes that mount the runtimes and keep the device set, which names what made a runtime or a simulator
      # go away
      - &simulator-log
        name: keep the simulator service's state and log
        if: failure() || cancelled()
        timeout-minutes: 10
        run: |
          mkdir -p mobile/ios/build/host-diagnostics
          { xcrun simctl runtime list -v; xcrun simctl list runtimes; xcrun simctl list devices; } \
            >mobile/ios/build/host-diagnostics/simulators.txt 2>&1 || true
          log show --last 3h --style compact \
            --predicate 'process IN {"CoreSimulatorService", "simdiskimaged", "cryptexd", "mobileassetd"}' \
            >mobile/ios/build/host-diagnostics/simulator-service.log 2>&1 || true
      - &upload-failure-diffs
        name: upload the failed snapshots and attachments
        if: failure() || cancelled() || hashFiles('mobile/ios/build/retried-tests.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-failure-diffs-${{ env.LEG }}
          path: |
            mobile/ios/build/snapshot-failures/
            mobile/ios/build/failure-attachments/
            mobile/ios/build/host-diagnostics/
          if-no-files-found: ignore
          retention-days: 1

  ui:
    needs: core
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # the legs of the suite (see "Suites" above), each with the arguments of its scripts/build-ios.sh run
      matrix:
        include: >-
          ${{ fromJSON((github.event_name == 'schedule' || inputs.suite == 'full') && '[
          {"leg": "ui-phone", "args": "--device phone ui"},
          {"leg": "ui-tablet-1", "args": "--device tablet --ui-shard 1/2 ui"},
          {"leg": "ui-tablet-2", "args": "--device tablet --ui-shard 2/2 ui"}
          ]' || '[
          {"leg": "ui-smoke-phone", "args": "--device phone smoke"},
          {"leg": "ui-smoke-tablet", "args": "--device tablet smoke"}
          ]') }}
    name: ${{ matrix.leg }}
    env:
      LEG: ${{ matrix.leg }}
    steps:
      - *checkout
      - *rust-toolchain
      - *vendor-restore
      - *ghostty-vt
      - *ios-toolchain
      - *prebuilt-core
      - *host-monitor
      - name: the UI test plan (${{ matrix.args }})
        env:
          ARGS: ${{ matrix.args }}
        run: |
          read -ra args <<<"$ARGS"
          scripts/build-ios.sh --prebuilt-core "${args[@]}"
      - *upload-results
      - *export-attachments
      - *runner-log
      - *simulator-log
      - *upload-failure-diffs

  # what the unit and ui jobs kept, under the names a run of one job gave them
  results:
    needs: [unit, ui]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ios-results-*
          path: ios-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-results
          path: ios-results/
          if-no-files-found: ignore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ios-failure-diffs-*
          path: ios-failure-diffs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-failure-diffs
          path: ios-failure-diffs/
          if-no-files-found: ignore

  archive:
    needs: core
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - *checkout
      - *rust-toolchain
      - *vendor-restore
      - *ghostty-vt
      - *ios-toolchain
      - *prebuilt-core
      - name: unsigned Release archive, with no fake core
        run: scripts/build-ios.sh --prebuilt-core archive
