# The iOS app (mobile/ios) over the mobile core (crates/ngterm-mobile), on GitHub's `xcode-27` image, whose Xcode 27.2
# and iOS 27.0 simulator runtime are the build/pins.env pins (the image's default Xcode is 27.1: scripts/setup-ios.sh
# finds /Applications/Xcode_27.2.app and exports it as DEVELOPER_DIR, which scripts/build-ios.sh takes from it). The
# core's own Rust checks on the hosts are cross-platform.yml's; this workflow runs what only Xcode can.
#
# The core is built once, by `core`, and the jobs that need it wait for that and then run side by side (one after
# another they took two hours; measured on main, 2026-11-14: the core 7 to 28 min, the lint's analyzer 33 to 39 min,
# the Unit plan 20 to 25 min, the UI plan 21 to 27 min on the phone and 30 to 53 min on the tablet):
#
# - `core`: scripts/build-ios.sh --no-xcode, the core for both iOS targets, its Swift bindings and XCFramework, kept
#   in a cache keyed by everything they are built from (the crates, the workspace's pins, toolchain and cargo config,
#   the libghostty-vt pins and patches, the scripts that build them), so a run over the same sources builds nothing.
#   The jobs below restore that cache entry and pass --prebuilt-core: none of them compiles Rust;
# - `core-tests`: the core's Rust tests on the phone simulator (ngterm-mobile's unit tests and ngterm-ghostty-vt's
#   tests, through scripts/ios-sim-runner.sh). It needs no XCFramework, so it starts with `core`;
# - `lint`: scripts/build-ios.sh lint: SwiftLint with its analyzer rules, swift-format, the suppression reasons, Swift
#   6 with warnings as errors. Its build log is kept as `ios-lint-log` when it fails;
# - `unit`: scripts/build-ios.sh coverage, the Unit test plan on both simulators and its line coverage, over both
#   simulators' profiles, checked against the floors of mobile/ios/coverage-floors.txt; the coverage summary
#   (Unit.coverage.txt and .json) is kept as `ios-coverage` on every run that wrote it;
# - `ui`: scripts/build-ios.sh ui, the UI test plan, a job per simulator, and the tablet's, the slower, in two shares
#   of the test classes (--ui-shard, which makes the shares the whole plan). A UI test that fails runs once more, and
#   each that passed on its retry is named with what failed it: a warning when XCTest gave up on the app, as it now
#   and then does on these virtual Macs, and otherwise a flaky test that fails the job (build-ios.sh's
#   report_retried_tests);
# - `results`: when a `unit` or `ui` job fails (or runs out of time, or retried a test:
#   mobile/ios/build/retried-tests.txt) its result bundles are kept, and the failed snapshots' images
#   (mobile/ios/build/snapshot-failures/) with the failed tests' attachments exported from the result bundles (each
#   snapshot's reference, failure and difference images, the UI audits' screenshots). This job gathers what those jobs
#   kept into `ios-results` and `ios-failure-diffs`, a directory per job (the jobs' own `ios-results-*` and
#   `ios-failure-diffs-*` last a day);
# - `archive`: scripts/build-ios.sh archive, an unsigned Release archive for devices, checked to hold no
#   NgtermCoreFakes symbol (the fake core is for Debug builds only), to answer the export compliance question, and to
#   carry a privacy manifest that covers the required-reason APIs its binary uses (scripts/ios-privacy-check.sh). The
#   signed archive, its export and its upload are ios-release.yml's.
#
# Every job that builds sets up the same way: the pinned Zig and the libghostty-vt prefix (scripts/build-ghostty-vt.sh,
# which setup-ios.sh then finds), then the iOS toolchain (scripts/setup-ios.sh: the Rust iOS targets, the phone and
# tablet simulators, SwiftLint). `unit` and `ui` end with their tests counted per simulator, so the split can be
# checked against `scripts/build-ios.sh test`, which runs both plans whole.
#
# The vendor root (the pinned Zig, its global cache, the libghostty-vt prefixes and the vendored SwiftLint) and cargo's
# registry and target directory are cached as cross-platform.yml's macOS leg caches them, under keys of this image;
# cargo's cache is `core`'s to save (`core-tests` reads it). The simulator runtime is the image's; Xcode's derived
# data is not cached.
#
# Path-filtered to what the app builds from: the mobile core and the crates it builds on, the workspace manifest, lock
# file, toolchain and cargo config, mobile/ios/ and the fonts it shares with Android, the scripts, patches and pins of
# its toolchain, and this file. Pushes to a `ci/**` branch run it too, and it can be run by hand.
name: ios

on:
  pull_request:
    paths: &paths
      # the mobile core and its build closure (`cargo tree -p ngterm-mobile`)
      - crates/ngterm-mobile/**
      - crates/ngterm-term/**
      - crates/ngterm-core/**
      - crates/ngterm-host/**
      - crates/ngterm-proto/**
      - crates/ngterm-ghostty-vt/**
      - crates/ngterm-ghostty-vt-sys/**
      # the workspace's dependency pins, toolchain and cargo config
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - mobile/ios/**
      # the mono fonts build-ios.sh copies from their one source, the Android app's
      - mobile/android/app/src/main/res/font/**
      - scripts/build-ios.sh
      - scripts/setup-ios.sh
      - scripts/ios-sim-runner.sh
      - scripts/ios-privacy-check.sh
      - scripts/ios-coverage.py
      - scripts/build-ghostty-vt.sh
      - scripts/lib/native.sh
      - build/pins.env
      - build/patches/ghostty-vt/**
      - .github/workflows/ios.yml
  push:
    branches: [main, "ci/**"]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  core:
    runs-on: xcode-27
    timeout-minutes: 90
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      # every crate, not only the core's build closure: ngterm-mobile embeds a file of a crate outside it
      - name: the key of the core's inputs
        id: key
        env:
          INPUTS: ${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'build/pins.env', 'build/patches/ghostty-vt/**', 'scripts/build-ios.sh', 'scripts/setup-ios.sh', 'scripts/build-ghostty-vt.sh', 'scripts/lib/native.sh') }}
        run: echo "key=ios-core-xcode-27-$INPUTS" >>"$GITHUB_OUTPUT"
      - name: the core a run built from these inputs
        id: built
        uses: actions/cache@v6
        with:
          path: &core-paths |
            mobile/ios/Packages/NgtermCore/Generated/NgtermCoreFFI.xcframework
            mobile/ios/Packages/NgtermCore/Generated/NgtermCoreBindings
          key: ${{ steps.key.outputs.key }}
      - name: rust toolchain (rust-toolchain.toml)
        if: steps.built.outputs.cache-hit != 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: steps.built.outputs.cache-hit != 'true'
        with:
          shared-key: ios
      # the vendor root, keyed like cross-platform.yml's legs', with the iOS setup that installs SwiftLint into it
      - uses: actions/cache@v6
        if: steps.built.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ngterm/vendor
          key: &vendor-key vendor-ngterm-xcode-27-${{ runner.arch }}-${{ hashFiles('build/pins.env', 'build/patches/ghostty-vt/**', 'scripts/lib/native.sh', 'scripts/setup-ios.sh') }}
      - name: Zig and the libghostty-vt prefix (build/pins.env)
        if: steps.built.outputs.cache-hit != 'true'
        run: scripts/build-ghostty-vt.sh
      - name: iOS toolchain (build/pins.env)
        if: steps.built.outputs.cache-hit != 'true'
        run: scripts/setup-ios.sh
      - name: the core for both iOS targets, its Swift bindings and XCFramework
        if: steps.built.outputs.cache-hit != 'true'
        run: scripts/build-ios.sh --no-xcode

  core-tests:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - &checkout
        uses: actions/checkout@v7
      - &rust-toolchain
        name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios
          save-if: false
      - &vendor-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ngterm/vendor
          key: *vendor-key
      - &ghostty-vt
        name: Zig and the libghostty-vt prefix (build/pins.env)
        run: scripts/build-ghostty-vt.sh
      - &ios-toolchain
        name: iOS toolchain (build/pins.env)
        run: scripts/setup-ios.sh
      - name: the core's Rust tests on the iOS simulator
        run: |
          eval "$(scripts/setup-ios.sh --check)"
          export CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUNNER="$PWD/scripts/ios-sim-runner.sh"
          cargo test -p ngterm-mobile --lib --target aarch64-apple-ios-sim
          cargo test -p ngterm-ghostty-vt --target aarch64-apple-ios-sim

  lint:
    needs: core
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - *checkout
      - *rust-toolchain
      - *vendor-cache
      - *ghostty-vt
      - *ios-toolchain
      - &prebuilt-core
        name: the core (the core job's)
        uses: actions/cache/restore@v6
        with:
          path: *core-paths
          key: ${{ needs.core.outputs.key }}
          fail-on-cache-miss: true
      - name: lint (SwiftLint and its analyzer rules, swift-format, the suppression reasons)
        run: scripts/build-ios.sh --prebuilt-core lint
      - name: upload the lint's build log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ios-lint-log
          path: mobile/ios/build/lint-analyze.log
          if-no-files-found: ignore

  unit:
    needs: core
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      LEG: unit
    steps:
      - *checkout
      - *rust-toolchain
      - *vendor-cache
      - *ghostty-vt
      - *ios-toolchain
      - *prebuilt-core
      - name: the Unit test plan on the phone and tablet, its coverage floors
        run: scripts/build-ios.sh --prebuilt-core coverage
      - name: upload the coverage summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-coverage
          path: mobile/ios/build/Unit.coverage.*
          if-no-files-found: ignore
      - &upload-results
        name: upload the result bundles
        if: failure() || cancelled() || hashFiles('mobile/ios/build/retried-tests.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ios-results-${{ env.LEG }}
          path: mobile/ios/build/*.xcresult
          if-no-files-found: ignore
          retention-days: 1
      # the failed tests' attachments out of the result bundles, so they can be looked at without Xcode: a snapshot's
      # reference, failure and difference images, a UI test's audit screenshots, each plan's manifest.json naming them.
      # A passing test keeps none, so everything is exported: `--only-failures` would miss the snapshots' images,
      # which Swift Testing records beside the issue rather than on it
      - &export-attachments
        name: export the failed tests' attachments
        if: failure() || cancelled() || hashFiles('mobile/ios/build/retried-tests.txt') != ''
        run: |
          eval "$(scripts/setup-ios.sh --check)"
          for bundle in mobile/ios/build/*.xcresult; do
            [[ -d "$bundle" ]] || continue
            xcrun xcresulttool export attachments --path "$bundle" \
              --output-path "mobile/ios/build/failure-attachments/$(basename "$bundle" .xcresult)" || true
          done
      - &upload-failure-diffs
        name: upload the failed snapshots and attachments
        if: failure() || cancelled() || hashFiles('mobile/ios/build/retried-tests.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ios-failure-diffs-${{ env.LEG }}
          path: |
            mobile/ios/build/snapshot-failures/
            mobile/ios/build/failure-attachments/
          if-no-files-found: ignore
          retention-days: 1

  ui:
    needs: core
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: ui-phone
            options: --device phone
          - leg: ui-tablet-1
            options: --device tablet --ui-shard 1/2
          - leg: ui-tablet-2
            options: --device tablet --ui-shard 2/2
    name: ${{ matrix.leg }}
    env:
      LEG: ${{ matrix.leg }}
    steps:
      - *checkout
      - *rust-toolchain
      - *vendor-cache
      - *ghostty-vt
      - *ios-toolchain
      - *prebuilt-core
      - name: the UI test plan (${{ matrix.options }})
        env:
          OPTIONS: ${{ matrix.options }}
        run: |
          read -ra options <<<"$OPTIONS"
          scripts/build-ios.sh --prebuilt-core "${options[@]}" ui
      - *upload-results
      - *export-attachments
      - *upload-failure-diffs

  # what the unit and ui jobs kept, under the names a run of one job gave them
  results:
    needs: [unit, ui]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ios-results-*
          path: ios-results
      - uses: actions/upload-artifact@v7
        with:
          name: ios-results
          path: ios-results/
          if-no-files-found: ignore
      - uses: actions/download-artifact@v8
        with:
          pattern: ios-failure-diffs-*
          path: ios-failure-diffs
      - uses: actions/upload-artifact@v7
        with:
          name: ios-failure-diffs
          path: ios-failure-diffs/
          if-no-files-found: ignore

  archive:
    needs: core
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - *checkout
      - *rust-toolchain
      - *vendor-cache
      - *ghostty-vt
      - *ios-toolchain
      - *prebuilt-core
      - name: unsigned Release archive, with no fake core
        run: scripts/build-ios.sh --prebuilt-core archive
