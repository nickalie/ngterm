# The protocol, cli, behaviors and ui layers against the released upstream app at the catalog's tag. A fresh runner,
# never a Mac running a live agterm: the reference would share its `com.umputun.agterm` defaults domain.
name: reference-macos

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "upstream release tag (default: the `upstream` of conformance/catalog.yaml)"
        required: false
      layer:
        description: "the layers to run"
        type: choice
        options:
          - all
          - protocol-cli-behaviors
          - ui
        default: all
      tests:
        description: "test paths or node ids under conformance/tests/, space-separated: one job runs only them (overrides layer)"
        required: false
  pull_request:
    paths:
      - conformance/**
      - .github/workflows/reference-macos.yml

permissions:
  contents: read

# Per run, not per job: a newer run on the ref cancels an older one, never a job of its own run.
concurrency:
  group: reference-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
      sharded: ${{ steps.plan.outputs.sharded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: conformance/catalog.yaml
          sparse-checkout-cone-mode: false
      - name: resolve the upstream tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [[ -z "$tag" && -f conformance/catalog.yaml ]]; then
            tag="$(sed -nE "s/^upstream:[[:space:]]*[\"']?([^\"'[:space:]#]+).*/\1/p" conformance/catalog.yaml | head -n 1)"
          fi
          if [[ -z "$tag" ]]; then
            echo "::error::no tag input and no upstream: in conformance/catalog.yaml"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # One macOS job per entry. The protocol, cli and behaviors layers run as SHARDS parts of one split
      # (agterm_conformance/shards.py), which the report job joins; a pull request runs every layer.
      - name: plan the jobs
        id: plan
        env:
          LAYER: ${{ inputs.layer }}
          TESTS: ${{ inputs.tests }}
          SHARDS: 3
        run: |
          entries=()
          entry() {
            entries+=("$(jq -nc --arg id "$1" --arg name "$2" --arg paths "$3" --arg shard "$4" --arg extra "$5" \
              '{id: $id, name: $name, paths: $paths, shard: $shard, extra: $extra}')")
          }
          sharded=false
          read -ra words <<< "$TESTS"
          if ((${#words[@]})); then
            extra=""
            for word in "${words[@]}"; do
              path="${word%%::*}"
              if [[ "$path" != conformance/tests/* || "/$path/" == */../* ]]; then
                echo "::error::tests: $word is not under conformance/tests/"
                exit 1
              fi
              if [[ "$word" == conformance/tests/ui/* || "$word" == conformance/tests/ui ]]; then extra="--reruns 1"; fi
            done
            entry tests "picked tests" "$TESTS" "" "$extra"
          else
            if [[ "${LAYER:-all}" != ui ]]; then
              sharded=true
              for ((index = 1; index <= SHARDS; index++)); do
                # --must-pass: a skipped, failed or deselected Live test fails its shard; the report job fails a run
                # that finds none or passes none.
                entry "shard-$index" "protocol, cli and behaviors $index/$SHARDS" \
                  "conformance/tests/protocol conformance/tests/cli conformance/tests/behaviors" \
                  "$index/$SHARDS" "--must-pass live-sessions"
              done
            fi
            if [[ "${LAYER:-all}" != protocol-cli-behaviors ]]; then
              entry ui "ui" "conformance/tests/ui" "" "--reruns 1"
            fi
          fi
          matrix="$(printf '%s\n' "${entries[@]}" | jq -sc '{include: .}')"
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "sharded=$sharded" >> "$GITHUB_OUTPUT"

  reference:
    name: ${{ matrix.name }}
    needs: plan
    # Apple silicon: the upstream release is arm64-only.
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      # one shard's failure must not cancel the others: the report job joins them all
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: install the suite and the ax driver's bindings
        run: python -m pip install -e "conformance[ax]"
      # A PR reads the entry from a manual run on main. Run this workflow on main after an upstream tag change.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: reference-cache
        with:
          path: &reference-path ~/.cache/agterm-conformance/reference
          key: &reference-key ngterm-reference-${{ needs.plan.outputs.tag }}
      - name: fetch the reference
        id: reference
        # bash, not the default `bash -e`: pipefail keeps a fetch failure from passing as tee's 0.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: python conformance/tools/fetch_reference.py --tag "$TAG" | tee -a "$GITHUB_OUTPUT"
      # one job saves the entry: the others fetch the same release
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.reference-cache.outputs.cache-hit != 'true' && strategy.job-index == 0
        with:
          path: *reference-path
          key: *reference-key
      - name: zsh login shell
        # Upstream wraps a pane in zmx only for a zsh login shell; the runner account starts with bash.
        run: |
          if [[ "$(dscl . -read "/Users/$USER" UserShell)" != "UserShell: /bin/zsh" ]]; then
            sudo dscl . -create "/Users/$USER" UserShell /bin/zsh
          fi
          python -c 'import os, pwd; shell = pwd.getpwuid(os.getuid()).pw_shell; print(shell); assert shell == "/bin/zsh"'
      - name: ${{ matrix.name }}
        # The ui layer: the image already grants accessibility to the runner's processes
        # (conformance/docs/spike-macos.md, spike B).
        shell: bash
        env:
          BUNDLE: ${{ steps.reference.outputs.bundle }}
          PATHS: ${{ matrix.paths }}
          SHARD: ${{ matrix.shard }}
          EXTRA: ${{ matrix.extra }}
        run: |
          read -ra paths <<< "$PATHS"
          read -ra extra <<< "$EXTRA"
          if [[ -n "$SHARD" ]]; then
            extra+=(--shard "$SHARD")
            weights=conformance/shard-weights-macos.txt
            if [[ -f "$weights" ]]; then extra+=("--shard-weights=$weights"); fi
          fi
          mkdir -p report
          python -m pytest "${paths[@]}" --impl swift-macos --bin "$BUNDLE" -ra "${extra[@]}" \
            --junitxml report/junit.xml --nodeid-report report/nodeids.jsonl 2>&1 | tee report/pytest.log
      - name: defaults the reference left in the runner account's domain
        # CFFIXED_USER_HOME moves NSHomeDirectory but not cfprefsd: every instance shares the account's
        # `com.umputun.agterm` domain, which is why reference-macos never runs on a Mac with a live agterm.
        if: always()
        run: |
          plist="$HOME/Library/Preferences/com.umputun.agterm.plist"
          if [[ -f "$plist" ]]; then plutil -p "$plist" | cut -c1-120 | head -n 60; else echo "none"; fi
      - name: keep the app logs of failed launches
        # A failed launch keeps its /tmp/agt-* root; its app log is the diagnosis.
        if: always()
        run: |
          for log in /tmp/agt-*/app.log; do
            if [[ -f "$log" ]]; then
              mkdir -p report/app-logs
              cp "$log" "report/app-logs/$(basename "$(dirname "$log")").log"
            fi
          done
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-macos-${{ needs.plan.outputs.tag }}-${{ matrix.id }}
          # report/traces/ holds per-test evidence beside the JUnit and nodeid reports.
          path: report/
          if-no-files-found: warn

  report:
    name: protocol, cli and behaviors (joined)
    needs: [plan, reference]
    # a failed shard still has its report to join
    if: ${{ !cancelled() && needs.plan.outputs.sharded == 'true' && needs.reference.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: install the suite
        run: python -m pip install -e conformance
      - name: download the shards' reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reference-macos-${{ needs.plan.outputs.tag }}-shard-*
          path: shards
      # Exit 2: a shard left no report, or the shards are not every part of one split. Without --list,
      # merge_shards.py judges no outcome: the step fails on each failed or not-run test, collection error and
      # --must-pass problem.
      - name: join the shards and fail on their failed tests, collection errors and --must-pass problems
        run: |
          python conformance/tools/merge_shards.py --title reference-macos --out report shards/*
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'EOF'
          import json
          import sys

          with open("report/nodeids.jsonl", encoding="utf-8") as lines:
              records = [json.loads(line) for line in lines]
          problems = [f"--must-pass live-sessions: {record['problem']}" for record in records
                      if record.get("kind") == "must-pass"]
          problems += [f"{record['outcome']}: {record['nodeid']}" for record in records
                       if record.get("kind") == "test" and record.get("outcome") in ("failed", "error", "not-run")]
          problems += [f"collection error: {record['nodeid']}" for record in records
                       if record.get("kind") == "collection-error"]
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          EOF
      - name: upload the joined report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-macos-${{ needs.plan.outputs.tag }}
          path: report/
          if-no-files-found: warn
