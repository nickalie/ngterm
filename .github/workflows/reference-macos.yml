# The protocol, cli, behaviors and ui layers against the released upstream app at the catalog's tag. A fresh runner,
# never a Mac running a live agterm: the reference would share its `com.umputun.agterm` defaults domain.
name: reference-macos

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "upstream release tag (default: the `upstream` of conformance/catalog.yaml)"
        required: false
  pull_request:
    paths:
      - conformance/**
      - .github/workflows/reference-macos.yml

permissions:
  contents: read

concurrency:
  group: reference-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    # Apple silicon: the upstream release is arm64-only.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: install the suite and the ax driver's bindings
        run: python -m pip install -e "conformance[ax]"
      - name: resolve the upstream tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [[ -z "$tag" && -f conformance/catalog.yaml ]]; then
            tag="$(sed -nE "s/^upstream:[[:space:]]*[\"']?([^\"'[:space:]#]+).*/\1/p" conformance/catalog.yaml | head -n 1)"
          fi
          if [[ -z "$tag" ]]; then
            echo "::error::no tag input and no upstream: in conformance/catalog.yaml"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/agterm-conformance/reference
          key: ngterm-reference-${{ steps.tag.outputs.tag }}
      - name: fetch the reference
        id: reference
        # bash, not the default `bash -e`: pipefail keeps a fetch failure from passing as tee's 0.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: python conformance/tools/fetch_reference.py --tag "$TAG" | tee -a "$GITHUB_OUTPUT"
      - name: zsh login shell
        # Upstream wraps a pane in zmx only for a zsh login shell; the runner account starts with bash.
        run: |
          if [[ "$(dscl . -read "/Users/$USER" UserShell)" != "UserShell: /bin/zsh" ]]; then
            sudo dscl . -create "/Users/$USER" UserShell /bin/zsh
          fi
          python -c 'import os, pwd; shell = pwd.getpwuid(os.getuid()).pw_shell; print(shell); assert shell == "/bin/zsh"'
      - name: protocol, cli and behaviors layers
        shell: bash
        env:
          BUNDLE: ${{ steps.reference.outputs.bundle }}
        run: |
          layers=()
          for layer in protocol cli behaviors; do
            if [[ -d "conformance/tests/$layer" ]]; then layers+=("conformance/tests/$layer"); fi
          done
          mkdir -p report
          # --must-pass: a skipped, failed or deselected Live test fails the job, as does finding none.
          python -m pytest "${layers[@]}" --impl swift-macos --bin "$BUNDLE" -ra --must-pass live-sessions \
            --junitxml report/junit.xml 2>&1 | tee report/pytest.log
      - name: ui layer
        # The image already grants accessibility to the runner's processes (conformance/docs/spike-macos.md, spike B).
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BUNDLE: ${{ steps.reference.outputs.bundle }}
        run: |
          mkdir -p report
          python -m pytest conformance/tests/ui --impl swift-macos --bin "$BUNDLE" -ra --reruns 1 \
            --junitxml report/junit-ui.xml 2>&1 | tee report/pytest-ui.log
      - name: defaults the reference left in the runner account's domain
        # CFFIXED_USER_HOME moves NSHomeDirectory but not cfprefsd: every instance shares the account's
        # `com.umputun.agterm` domain, which is why reference-macos never runs on a Mac with a live agterm.
        if: always()
        run: |
          plist="$HOME/Library/Preferences/com.umputun.agterm.plist"
          if [[ -f "$plist" ]]; then plutil -p "$plist" | cut -c1-120 | head -n 60; else echo "none"; fi
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-macos-${{ steps.tag.outputs.tag }}
          # report/traces/ holds per-test evidence beside the JUnit reports.
          # A failed launch keeps its /tmp/agt-* root; its app log is the diagnosis.
          path: |
            report/
            /tmp/agt-*/app.log
          if-no-files-found: warn
