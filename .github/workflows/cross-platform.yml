# The crates that build on all three OSes, checked on Linux, macOS and Windows alike: format, strict clippy and the
# tests of each crate in PACKAGES. Each task that makes a crate cross-platform adds it to PACKAGES and its generator
# checks as steps of the `crates` job. No Miri job: it ran the Rust VT port's memory core (page buffers, its
# allocators), which left this branch with the port (branch `rust-vt-port`). The rest of the workspace (GPUI, WPE)
# is checked on Linux only, in linux.yml. ngterm-server (the control socket: AF_UNIX on Linux and macOS, a named
# pipe on Windows) and ngterm-ctl (the CLI over it, tested against the server; its overlay job in a Job object and
# its stream bridge on the console on Windows) are in PACKAGES. ngterm-app's hook runner, log file, remote
# presentation process and agent integrations' installers have their Windows forms beside the Unix ones (macOS takes
# the Unix forms); its tests that run the agent-status package's POSIX scripts and plugins are Unix-only.
# ngterm-headless (the core, control socket and live sessions with no window) is in PACKAGES: its quit is signals on
# Unix and the console's Ctrl events on Windows. ngterm-mobile (the Android app's core: ssh, the presentation client,
# stream panes, its UniFFI facade) is in PACKAGES too, so its unit tests run on every host; its end-to-end test is
# `#[ignore]` (and Linux-only) here, run by android.yml through scripts/test-mobile-e2e.sh.
#
# ngterm-gpui (the app) builds, lints and tests on the Windows runner too, with its `html` feature (the HTML overlays on
# WebView2, whose runtime the runner image carries) and without it, in steps of its own: it embeds the terminal fonts
# scripts/fetch-fonts.sh vendors, and its tests that run the app on Xvfb, weston, lavapipe or a D-Bus bus, or pages on
# WPE WebKit, are Linux-only. macOS builds the native frontend and WKWebView overlays with the same checks.
#
# libghostty-vt (ngterm-ghostty-vt-sys, its wrapper ngterm-ghostty-vt) builds here from the prefix
# scripts/build-ghostty-vt.sh prepares with the pinned Zig of each runner's OS and arch (Git Bash on Windows, stock
# bash 3.2 on macOS); the sys crate's build script runs `zig build` over it, offline. The vendor cache keeps the
# prefix, the pinned Zig and Zig's global cache (the C runtime and compiler_rt builds); the library itself is rebuilt
# in each run, since the workspace crates' build outputs are not cached. The three Zig targets no runner here runs
# natively are cross-built (`cargo build --target` of the sys crate, which runs its zig build; nothing is linked):
# aarch64 Linux and x86_64 macOS on the Linux job, aarch64 Windows on the Windows one, since Zig builds windows-msvc
# only against an MSVC installation (from Linux, simdutf and Wuffs' translate-c find no MSVC headers).
#
# Pushes to a `ci/**` branch run it too, so a macOS or Windows form can be checked on the runners without a PR.
#
# A change of Markdown alone runs nothing: docs, plans, backlog and READMEs are neither built nor tested. The Markdown
# that is (the bundled skill under resources/, vendored trees, the patch notes under build/) is put back after the
# exclusion; the two lists are the same. Nor does a change of the iOS app's sources alone (mobile/ios/): nothing here
# builds or reads them (ios.yml does); its core, crates/ngterm-mobile, lies outside it and stays in PACKAGES' checks.
name: cross-platform

on:
  pull_request:
    paths: ["**", "!**/*.md", "!mobile/ios/**", "resources/**", "vendor/**", "build/**"]
  push:
    branches: [main, "ci/**"]
    paths: ["**", "!**/*.md", "!mobile/ios/**", "resources/**", "vendor/**", "build/**"]

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # `-p` per crate; word-split by bash, which every step runs in (Git Bash on Windows)
  PACKAGES: >-
    -p ngterm-session -p ngterm-proto -p ngterm-host -p ngterm-core -p ngterm-ghostty-vt-sys -p ngterm-ghostty-vt
    -p ngterm-pty -p ngterm-term -p ngterm-server -p ngterm-ctl -p ngterm-app -p ngterm-headless -p ngterm-mobile
    -p ngterm-update

defaults:
  run:
    shell: bash

jobs:
  crates:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            cross: aarch64-unknown-linux-gnu x86_64-apple-darwin
          - os: macos-26
            cross: ""
          - os: windows-2025
            cross: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    # Measured 2026-10-19 with cold caches: the prefix 25 s (Ubuntu), 1 min (macOS), 2 min (Windows); the first
    # cargo step (clippy), which builds libghostty-vt first, 3 min (Ubuntu), 4.5 min (macOS), 2 min (Windows); each
    # cross build 1.5-2.5 min; the whole job 9-12 min. A warm Zig global cache saved little on Ubuntu (clippy 2.6 min).
    # The Windows job also builds ngterm-gpui (GPUI and its DirectX platform), measured 2026-10-30 on the runner with a
    # cold cache: its clippy 3.5 min, its tests 7 min, the whole job 27.5 min; the limit leaves it room.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # only main saves caches: a branch's would crowd main's out of the repository's cache space
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The libghostty-vt prefix, the pinned Zig it was prepared with and Zig's global cache; keyed like the prefix
      # (its pins and patches, native.sh holding its layout).
      - uses: actions/cache@v6
        if: github.ref == 'refs/heads/main'
        with: &vendor-crates
          path: ~/.cache/ngterm/vendor
          key: vendor-ngterm-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('build/pins.env', 'build/patches/ghostty-vt/**', 'scripts/lib/native.sh') }}
      - uses: actions/cache/restore@v6
        if: github.ref != 'refs/heads/main'
        with: *vendor-crates
      - name: libghostty-vt prefix
        run: scripts/build-ghostty-vt.sh
      - name: format
        run: |
          # shellcheck disable=SC2086 # PACKAGES is a list of cargo arguments, split on purpose
          cargo fmt $PACKAGES --check
      - name: clippy
        run: |
          # shellcheck disable=SC2086 # PACKAGES is a list of cargo arguments, split on purpose
          cargo clippy --locked $PACKAGES --all-targets --all-features -- -D warnings
      - name: test
        run: |
          if [[ "$(uname -s)" == Darwin ]]; then ulimit -n 8192; fi
          # shellcheck disable=SC2086 # PACKAGES is a list of cargo arguments, split on purpose
          cargo test --locked $PACKAGES --all-features
      # ngterm-term without `local` (stream panes only, a remote-only frontend's): its own invocation, as
      # --all-features turns the feature back on
      - name: ngterm-term without local panes
        run: |
          cargo clippy --locked -p ngterm-term --no-default-features --all-targets -- -D warnings
          cargo test --locked -p ngterm-term --no-default-features --lib
      # vendor/portable-pty is a [patch] provider, not a member: its own tests of the Windows patches (malformed
      # environments, directories on PATH, the raw command tail) run in a copy made a workspace of its own, as herdr verifies them
      - name: vendored portable-pty's Windows patch tests
        if: runner.os == 'Windows'
        run: |
          copy="$(cygpath -u "$RUNNER_TEMP")/portable-pty"
          cp -r vendor/portable-pty "$copy"
          printf '\n[workspace]\n' >> "$copy/Cargo.toml"
          cargo test --manifest-path "$copy/Cargo.toml" --lib windows_
      # vendor/accesskit_windows likewise: its patch 0001's tests (a clickable menu item keeps Invoke whatever its
      # highlight); the crate builds on Windows only
      - name: vendored accesskit_windows's patch tests
        if: runner.os == 'Windows'
        run: |
          copy="$(cygpath -u "$RUNNER_TEMP")/accesskit_windows"
          cp -r vendor/accesskit_windows "$copy"
          printf '\n[workspace]\n' >> "$copy/Cargo.toml"
          cargo test --manifest-path "$copy/Cargo.toml" --lib invoke_tests
      - name: terminal fonts (ngterm-gpui embeds them)
        if: runner.os != 'Linux'
        run: scripts/fetch-fonts.sh
      - name: ngterm-gpui clippy (native frontend, without html)
        if: runner.os != 'Linux'
        run: cargo clippy --locked -p ngterm-gpui --no-default-features --all-targets -- -D warnings
      - name: ngterm-gpui test (native frontend, without html)
        if: runner.os != 'Linux'
        run: |
          if [[ "$(uname -s)" == Darwin ]]; then ulimit -n 8192; fi
          cargo test --locked -p ngterm-gpui --no-default-features
      - name: ngterm-gpui clippy (native frontend, html)
        if: runner.os != 'Linux'
        run: cargo clippy --locked -p ngterm-gpui --all-targets -- -D warnings
      - name: ngterm-gpui test (native frontend, html)
        if: runner.os != 'Linux'
        run: |
          if [[ "$(uname -s)" == Darwin ]]; then ulimit -n 8192; fi
          cargo test --locked -p ngterm-gpui
      - name: AppKit and WebKit services smoke test
        if: runner.os == 'macOS'
        run: scripts/smoke-macos-services.sh
      - name: cross build of libghostty-vt for ${{ matrix.cross }}
        if: matrix.cross != ''
        run: |
          for target in ${{ matrix.cross }}; do
            rustup target add "$target"
            cargo build --locked -p ngterm-ghostty-vt-sys --target "$target"
          done

  # The conformance suite on Windows (conformance/tools/run-windows.sh): the release app with its HTML overlays, the
  # CLI and the live sessions' server staged by scripts/stage.sh, the protocol, cli and behaviors layers run against
  # them over the control socket's named pipe and the ui layer through UI Automation and SendInput (drivers/uia.py),
  # each instance on a private root (its home, application data, state dir and pipe; its window on the runner's
  # desktop, which no one uses), its panes in Git for Windows' sh, its process tree reaped by pid. Held by
  # conformance/rust-passing-windows.txt, the Windows ratchet beside rust-passing.txt.
  #
  # Four jobs make it, as in linux.yml:
  # - windows-build: the harness's Windows self-tests (the pipe transport, the launch and stop), then the stage
  #   (run-windows.sh --build-only), kept as the rust-windows-stage artifact; once more instrumented (--coverage), as
  #   rust-windows-stage-cov for a day.
  # - windows: the suite on that stage, split by test file into the shards of its matrix (run-windows.sh --stage
  #   --shard I/N, agterm_conformance/shards.py; the matrix's `shard` list and the N of its run step go together). A
  #   shard builds nothing; it judges the listed ids it ran, so a red one fails its own job.
  # - coverage-windows: the same shards on the instrumented stage, every layer (the toolchain's llvm-tools read each
  #   shard's profiles against the staged programs); the ratchet stays the windows job's, as instrumentation slows
  #   the app.
  # - windows-report: each of the two joined into its one report (tools/merge_shards.py), kept under the artifact
  #   name the unsharded job had: the ratchet judged on the whole run, and for coverage the shards' lcov joined into
  #   the desktop app's e2e line coverage on Windows (code_coverage.py e2e: the total, its distance to 90% and the
  #   share markers exclude, per crate), judged by conformance/coverage/e2e-floor-desktop-windows.txt
  #   (tools/check_coverage.py: the total and each crate). A shard that left no report, or a set that is not one
  #   whole split, fails it. Its coverage/ alone (lcov.info: what a merge and the gap lists read) is uploaded as
  #   e2e-coverage-desktop-windows. Each shard's own report is kept three days beside the joined one.
  windows-build:
    name: windows build (${{ matrix.build }})
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # the cargo caches the unsharded jobs saved
          - build: release
            cache: conformance-windows
            stage: conformance-stage
            artifact: rust-windows-stage
            retention: 5
          - build: coverage
            cache: coverage-coverage-windows
            stage: conformance-stage-cov
            artifact: rust-windows-stage-cov
            retention: 1
            flag: --coverage
    steps:
      - uses: actions/checkout@v7
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: llvm-tools (coverage)
        if: matrix.build == 'coverage'
        run: rustup component add llvm-tools
      - name: cargo-llvm-cov (coverage)
        if: matrix.build == 'coverage'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ${{ matrix.cache }}
      - uses: actions/cache@v6
        if: github.ref == 'refs/heads/main'
        with: &vendor-windows
          path: ~/.cache/ngterm/vendor
          key: vendor-ngterm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/pins.env', 'build/patches/ghostty-vt/**', 'scripts/lib/native.sh') }}
      - uses: actions/cache/restore@v6
        if: github.ref != 'refs/heads/main'
        with: *vendor-windows
      - name: libghostty-vt prefix
        run: scripts/build-ghostty-vt.sh
      - name: terminal fonts
        run: scripts/fetch-fonts.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: install the suite
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -e conformance
      - name: the harness's Windows self-tests
        if: matrix.build == 'release'
        run: >-
          .venv/Scripts/python.exe -m pytest conformance/selftests/test_transport.py
          conformance/selftests/test_client.py conformance/selftests/test_windows_launch.py
          conformance/selftests/test_uia.py
      - name: build and stage
        run: conformance/tools/run-windows.sh ${{ matrix.flag }} --build-only
      # the staged tree the shards run; the release one also serves a run on a Windows VM against the same build
      # (run-windows.sh --stage)
      - name: upload the stage
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.stage }}/
          retention-days: ${{ matrix.retention }}
          if-no-files-found: error

  windows:
    name: windows (${{ matrix.shard }}/3)
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: install the suite
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -e conformance
      - name: download the stage
        uses: actions/download-artifact@v8
        with:
          name: rust-windows-stage
          path: target/conformance-stage
      # Exits with the ratchet's status over the listed ids this shard ran; check_ratchet.py lists the newly green ids
      # in the job summary.
      # every stopped instance's logs (the harness's and the app's own), named after its test, uploaded with the report
      # --must-pass live-any-shell: the login shell is Windows PowerShell, which the build runs its live sessions in; a
      # skipped, failed or deselected Live test fails the job, as does finding none in any shard (windows-report).
      # --must-pass agent-chat: the Rust-only agent record and `ngtermctl agent` behind the Android chat view,
      # likewise; --must-pass kitty-clipboard: a program's Rust-only Kitty clipboard protocol, likewise. --must-pass
      # agterm-peer: the Windows viewer's ssh.exe attach of an upstream agterm Mac (the loopback-sshd tests need
      # posix-command-line); --must-pass shell-profiles: the Rust-only shell profiles, the detected Windows shells
      # included.
      - name: shard ${{ matrix.shard }}/3 (protocol, cli, behaviors, ui)
        run: >-
          CONFORMANCE_KEEP_LOGS="$(cygpath -w "$PWD/conformance/reports/rust-windows/instances")"
          conformance/tools/run-windows.sh --stage "$PWD/target/conformance-stage" --shard ${{ matrix.shard }}/3
          -- --must-pass live-any-shell --must-pass agent-chat --must-pass kitty-clipboard
          --must-pass agterm-peer --must-pass shell-profiles
      - name: report into the summary
        if: always()
        run: |
          report=conformance/reports/rust-windows/report.md
          if [[ -f "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: upload the shard's report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-windows-conformance-shard-${{ matrix.shard }}
          # Includes per-test traces/ alongside the nodeid report.
          path: conformance/reports/rust-windows/
          retention-days: 3
          if-no-files-found: warn

  coverage-windows:
    name: coverage-windows (${{ matrix.shard }}/3)
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      # the report of an instrumented run reads its profiles with the toolchain's llvm-cov and llvm-profdata
      - name: rust toolchain (rust-toolchain.toml) with llvm-tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: install the suite
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -e conformance
      - name: download the stage
        uses: actions/download-artifact@v8
        with:
          name: rust-windows-stage-cov
          path: target/conformance-stage-cov
      # Only a run without a coverage report (exit 2) fails here: the ratchet verdict (exit 1) is the windows job's to
      # judge. Unsetting GITHUB_STEP_SUMMARY only keeps the ratchet checker's own summary block out; the suite's
      # report.md, appended below, still carries its ratchet verdict.
      - name: instrumented shard ${{ matrix.shard }}/3 (protocol, cli, behaviors, ui)
        run: |
          status=0
          CONFORMANCE_KEEP_LOGS="$(cygpath -w "$PWD/conformance/reports/rust-windows-coverage/instances")" \
            env -u GITHUB_STEP_SUMMARY conformance/tools/run-windows.sh --coverage \
            --stage "$PWD/target/conformance-stage-cov" --shard ${{ matrix.shard }}/3 \
            --out conformance/reports/rust-windows-coverage || status=$?
          if ((status == 2)); then exit 2; fi
          echo "run-windows.sh exited $status (the ratchet is not judged here)"
      - name: report into the summary
        if: always()
        run: |
          report=conformance/reports/rust-windows-coverage/report.md
          if [[ -f "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: upload the shard's report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-windows-coverage-conformance-shard-${{ matrix.shard }}
          # coverage/ (the shard's e2e report: lcov.info) and the per-test traces/ beside the nodeid report
          path: conformance/reports/rust-windows-coverage/
          retention-days: 3
          if-no-files-found: warn

  windows-report:
    name: windows (${{ matrix.out }})
    needs: [windows, coverage-windows]
    # a failed shard still has its report to join; shards that never started (the build failed) have none
    if: ${{ !cancelled() && needs.windows.result != 'skipped' && needs.coverage-windows.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - out: rust-windows
          - out: rust-windows-coverage
            coverage: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: install the suite
        run: python -m pip install -e conformance
      - name: download the shards' reports
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.out }}-conformance-shard-*
          path: shards
      # Exits with the ratchet's status over the whole list; check_ratchet.py lists the newly green ids in the job
      # summary.
      - name: join the shards and hold the ratchet
        if: ${{ !matrix.coverage }}
        run: >-
          python conformance/tools/merge_shards.py --title rust-windows
          --list conformance/rust-passing-windows.txt
          --out conformance/reports/${{ matrix.out }} shards/*
      # Only a run without a coverage report (exit 2) fails here: the ratchet is the entry above's to judge.
      - name: join the shards and their coverage
        if: matrix.coverage
        run: |
          status=0
          env -u GITHUB_STEP_SUMMARY python conformance/tools/merge_shards.py --title rust-windows \
            --list conformance/rust-passing-windows.txt --coverage desktop windows \
            --out conformance/reports/${{ matrix.out }} shards/* || status=$?
          if ((status == 2)); then exit 2; fi
          echo "merge_shards.py exited $status (the ratchet is not judged here)"
      - name: coverage floors
        if: matrix.coverage
        run: >-
          python conformance/tools/check_coverage.py
          --summary conformance/reports/${{ matrix.out }}/coverage/summary.md
          --floor conformance/coverage/e2e-floor-desktop-windows.txt
      - name: upload the e2e coverage
        if: ${{ matrix.coverage && !cancelled() && hashFiles('conformance/reports/rust-windows-coverage/coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage-desktop-windows
          path: conformance/reports/${{ matrix.out }}/coverage/
          if-no-files-found: error
      - name: report into the summary
        if: always()
        run: |
          report=conformance/reports/${{ matrix.out }}/report.md
          if [[ -f "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.out }}-conformance
          # the shards' joined nodeid report, junit.xml and pytest.log, their per-test traces/ and instances/, and
          # each shard's own report (with its coverage/) under shards/
          path: conformance/reports/${{ matrix.out }}/
          if-no-files-found: warn
