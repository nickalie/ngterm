# The Rust workspace on Linux: format, strict clippy, the lint report and cargo test. Then the staged build under the
# conformance suite, once the cargo job passes. The WPE WebKit crates (the -sys crates and ngterm-wpe) and the app's
# HTML overlays over them need a WPE WebKit Ubuntu does not package: the Ubuntu job builds the workspace without them
# and the app without the overlays (WORKSPACE_WITHOUT_WPE and GPUI_WITHOUT_HTML in scripts/lib/native.sh), the wpe job
# checks them on Arch, and the conformance jobs run there too, as does the unit-coverage job (the whole workspace's
# `cargo test` under cargo-llvm-cov, judged by its coverage floors).
name: linux

# A change of Markdown alone runs nothing: docs, plans, backlog and READMEs are neither built nor tested. The Markdown
# that is (the bundled skill under resources/, vendored trees, the patch notes under build/) is put back after the
# exclusion; the two lists are the same. Nor does a change of the iOS app's sources alone (mobile/ios/): nothing here
# builds, tests or reads them (ios.yml does), so the conformance ratchet has nothing to check in them.
on:
  pull_request:
    paths: ["**", "!**/*.md", "!mobile/ios/**", "resources/**", "vendor/**", "build/**"]
  push:
    branches: [main]
    paths: ["**", "!**/*.md", "!mobile/ios/**", "resources/**", "vendor/**", "build/**"]

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev \
            meson ninja-build libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            curl xz-utils patch ncurses-bin fish zsh fontconfig fonts-dejavu-core \
            dbus-daemon weston xvfb x11-xkb-utils libgl1-mesa-dri libegl-mesa0 mesa-vulkan-drivers \
            g++ libpixman-1-dev libinput-dev libevdev-dev libudev-dev libdrm-dev libegl-dev libgles-dev libgbm-dev \
            libcairo2-dev libpango1.0-dev libpng-dev hwdata
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # ngterm-app's OpenCode plugin tests run the shipped plugin under node (22.7+, module-syntax detection), required
      # here by NGTERM_REQUIRE_NODE_TESTS on the test step rather than skipped
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      # The prefixes, the Zig toolchain libghostty-vt's was prepared with and the Zig global cache of its builds;
      # keyed like the prefixes themselves (`ngterm`: the share/ngterm manifest layout; native.sh holds `prefix_key`
      # and the libghostty-vt prefix's layout, part of its key).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ngterm/vendor
          key: vendor-ngterm-${{ runner.os }}-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('build/pins.env', 'build/patches/**', 'scripts/lib/native.sh') }}
      - name: pinned Zig toolchain (sha256 from build/pins.env)
        shell: bash
        run: |
          source scripts/lib/native.sh
          mkdir -p "$VENDOR_ROOT"
          # Assign first: a failure inside $(...) of an echo argument would not reach errexit.
          sha="$(zig_pin_sha256 LIBGHOSTTY_VT)"
          zig="$(find_zig "$LIBGHOSTTY_VT_ZIG_VERSION" "$sha" "")"
          echo "LIBGHOSTTY_VT: $zig"
      # the patched source ngterm-ghostty-vt-sys builds the static libghostty-vt from (with zig, offline, when
      # `cargo build --workspace` builds it); Ghostty's resources beside it
      - name: libghostty-vt prefix
        run: scripts/build-ghostty-vt.sh
      # the fonts Ghostty embeds, which ngterm-gpui (built with the workspace) embeds too
      - name: terminal fonts
        run: scripts/fetch-fonts.sh
      # GPUI needs a seat on its headless weston, which only --fake-seat gives (weston 15.0+; Ubuntu 26.04 ships 14):
      # the pinned weston, first on PATH, where ngterm-gpui's process tests look for one taking it.
      - name: weston prefix (--fake-seat)
        run: echo "$(scripts/build-weston.sh)/bin" >> "$GITHUB_PATH"
      - name: format
        run: cargo fmt --all --check
      - name: Cargo.lock is current
        run: cargo metadata --locked --format-version 1 >/dev/null
      # before clippy: a dependency turning on tracing's `log` would put dozens of functions over the complexity limit
      - name: tracing features
        run: scripts/check-tracing-features.sh
      - name: vendored calloop
        run: scripts/vendor-calloop.sh --check
      - name: vendored GPUI (external surfaces patch)
        run: scripts/vendor-gpui.sh --check
      - name: vendored portable-pty
        run: scripts/vendor-portable-pty.sh --check
      - name: vendored accesskit_atspi_common
        run: scripts/vendor-accesskit-atspi.sh --check
      - name: vendored accesskit_windows
        run: scripts/vendor-accesskit-windows.sh --check
      # the workspace without what links WPE WebKit, which the Arch jobs check, then the app without its HTML overlays
      # (its own invocation: --all-features would turn them back on)
      - name: clippy
        shell: bash
        run: |
          source scripts/lib/native.sh
          cargo clippy "${WORKSPACE_WITHOUT_WPE[@]}" --all-targets --all-features -- -D warnings
          cargo clippy "${GPUI_WITHOUT_HTML[@]}" --all-targets -- -D warnings
          cargo clippy -p ngterm-term --no-default-features --all-targets -- -D warnings
      - name: lint report
        shell: bash
        run: scripts/lint-report.sh | tee -a "$GITHUB_STEP_SUMMARY"
      # fish and zsh are installed above so the replay scripts' unit tests and their interrupted-replay PTY tests
      # (ngterm-session's tests/replay.rs) run against real fish and zsh, beside bash
      # ngterm-gpui's process tests run on their own private bus, headless weston and Xvfb, rendering on lavapipe
      # (mesa-vulkan-drivers): none may skip here (only the nested-niri check is #[ignore]d, no niri on Ubuntu). They
      # run without the HTML overlays here; the bash conformance job runs the instance tests again with them, on Arch.
      # ngterm-gpui's external texture test imports synthetic dmabufs from udmabuf on lavapipe; required here like
      # the display tests, so the device must be there. udmabuf is a bool in the kernel's Kconfig, built in or absent
      # and never a module, so there is nothing to modprobe or install: the runner's kernel has it or the job fails.
      # systemd's udev rules give the device to the kvm group, which the runner user is not in.
      - name: udmabuf for the external texture test
        shell: bash
        run: |
          if [[ ! -c /dev/udmabuf ]]; then
            config="$(grep -s '^CONFIG_UDMABUF=' "/boot/config-$(uname -r)" || echo 'no CONFIG_UDMABUF=y')"
            echo "::error::no /dev/udmabuf on kernel $(uname -r) ($config): the external texture test needs it"
            exit 1
          fi
          sudo chmod a+rw /dev/udmabuf
          ls -l /dev/udmabuf
      - name: test
        shell: bash
        env:
          NGTERM_REQUIRE_DISPLAY_TESTS: "1"
          NGTERM_REQUIRE_NODE_TESTS: "1"
        run: |
          source scripts/lib/native.sh
          cargo test "${WORKSPACE_WITHOUT_WPE[@]}"
          cargo test "${GPUI_WITHOUT_HTML[@]}"
          cargo test -p ngterm-term --no-default-features --lib
          # the vendored GPUI Linux platform's own tests, ngterm's patches' among them (not a workspace member)
          cargo test -p gpui-pre-linux --lib

  # The WPE WebKit -sys crates (gir bindings of the app's HTML engine) against the distro package they are generated
  # from: Arch's wpewebkit at WPE_VERSION (build/pins.env), installed from a date-pinned Arch Linux Archive snapshot in
  # a digest-pinned archlinux container (Ubuntu packages no wpewebkit at all), privileged so WebKit's bubblewrap sandbox
  # gets its user namespaces (without them no web process starts); then the checked-in bindings must equal a
  # regeneration at the pins. Bump ARCH_SNAPSHOT (a day whose extra repo carries the pinned wpewebkit) and the image
  # digest with the WPE_ pins.
  # archive.archlinux.org stalls now and then, which fails pacman's stall timeout: every sync from the snapshot goes
  # through pacman-archive (written by the first step; the conformance jobs carry the same one), which downloads
  # without that timeout, each attempt bounded by `timeout` instead, retries the whole download three times, then
  # upgrades and installs from the cache.
  wpe:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    container:
      # archlinux:base-devel-20261011.0.609700
      image: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
      options: --privileged
    env:
      CARGO_TERM_COLOR: always
      ARCH_SNAPSHOT: "2026/10/14"
    steps:
      - name: system packages from the Arch Linux Archive snapshot
        run: |
          echo "Server = https://archive.archlinux.org/repos/$ARCH_SNAPSHOT/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          cat > /usr/local/bin/pacman-archive <<'EOF'
          #!/bin/bash
          # pacman-archive PKG...: the snapshot's upgrade and PKG..., downloaded with retries, installed from the cache
          set -u
          for attempt in 1 2 3; do
            if timeout --kill-after=1m 15m pacman -Syyuuw --needed --noconfirm --disable-download-timeout "$@"; then
              exec pacman -Suu --needed --noconfirm "$@"
            fi
            rm -f /var/lib/pacman/db.lck
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::download from the Arch Linux Archive failed (attempt $attempt of 3), retrying in 30s"
              sleep 30
            fi
          done
          echo "::error::download from the Arch Linux Archive failed 3 times: $*"
          exit 1
          EOF
          chmod +x /usr/local/bin/pacman-archive
          pacman-archive git wpewebkit bubblewrap rustup
      - uses: actions/checkout@v7
      - name: the snapshot's wpewebkit is the pinned one
        shell: bash
        run: |
          source build/pins.env
          installed="$(pacman -Q wpewebkit | cut -d' ' -f2)"
          echo "wpewebkit $installed, pinned $WPE_VERSION; pkg-config: $(pkg-config --modversion wpe-webkit-2.0)"
          [[ "$installed" == "$WPE_VERSION"-* ]]
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # the gir binary and the unpacked package the regeneration reads its .gir files from, and the libghostty-vt
      # source with its Zig global cache; keyed like the prefixes
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ngterm/vendor
          key: vendor-ngterm-wpe-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/pins.env', 'build/patches/**', 'scripts/lib/native.sh') }}
      # Before the first clippy: the WPE crates reach ngterm-ghostty-vt-sys too, whose build script needs the source
      # prepared here, and a cold vendor cache has none. The app with its HTML overlays (feature `html`, the default)
      # gets its clippy, its unit tests and the headless page harness below (the real engine on lavapipe, in SHM: no
      # render node here). It links the static libghostty-vt, which ngterm-ghostty-vt-sys builds from the source the
      # script prepares (with its own pinned Zig), and embeds the terminal fonts the other script fetches; its unit
      # tests measure DejaVu Sans Mono through fontconfig. The harness's audio case needs GStreamer's playbin
      # (gst-plugins-base) and its WAV parser (gst-plugins-good), which wpewebkit leaves optional.
      - name: what the app builds on
        run: |
          pacman-archive curl xz patch vulkan-swrast mesa fontconfig ttf-dejavu gst-plugins-base gst-plugins-good
          scripts/build-ghostty-vt.sh
          scripts/fetch-fonts.sh
          scripts/fetch-lavapipe.sh
      - name: clippy
        run: >-
          cargo clippy -p ngterm-wpe-client -p ngterm-wpe -p ngterm-wpe-sys -p ngterm-wpe-platform-sys -p ngterm-wpe-javascriptcore-sys
          --all-targets --all-features -- -D warnings
      # ngterm-wpe's engine tests run pages headless in SHM mode here (the runner has no DRM render node, so its
      # dmabuf mode reports itself skipped), in process and through a worker process (the system's package needs no
      # worker; the vendored one always gets one, so its transport is tested here too)
      - name: test
        run: cargo test -p ngterm-wpe-client -p ngterm-wpe -p ngterm-wpe-sys -p ngterm-wpe-platform-sys -p ngterm-wpe-javascriptcore-sys
      - name: the bindings are a regeneration at the pins
        run: scripts/gen-wpe-bindings.sh --check
      - name: clippy (ngterm-gpui, html)
        run: cargo clippy -p ngterm-gpui --all-targets -- -D warnings
      - name: build HTML worker
        run: cargo build -p ngterm-wpe --bin ngterm-web
      - name: test (ngterm-gpui, html)
        run: |
          cargo test -p ngterm-gpui --lib
          NGTERM_REQUIRE_DISPLAY_TESTS=1 cargo test -p ngterm-gpui --test html_overlay

  # What `cargo test` covers (scripts/unit-coverage.sh: the workspace's tests at their default features, under
  # cargo-llvm-cov, test code and vendor/ out of the denominator), judged by scripts/unit-coverage-floor-linux.txt
  # (conformance/tools/check_coverage.py: lines, functions and regions % per workspace crate), whose floors come from
  # this job's own reports. The default features need WPE WebKit, so it runs in the wpe job's Arch container (the same
  # digest, Arch Linux Archive snapshot and pacman-archive), privileged for WebKit's bubblewrap sandbox, with the
  # conformance jobs' packages and setup (the pinned weston where Arch's lacks --fake-seat, lavapipe), node for
  # ngterm-app's OpenCode plugin tests and GStreamer for the html_overlay harness's audio case; the tests run as an
  # unprivileged user (see its step) on a private Xvfb and session bus. The display, node and udmabuf tests are
  # required; what needs a DRM render node, which the runner lacks (ngterm-wpe's dmabuf mode, the external texture's
  # Mesa GPU case), reports itself skipped, as in the wpe job. A failed test fails the job after the report and the floors
  # are judged; the report (lcov.info, summary.json, summary.md, summary-files.md) is uploaded as
  # rust-linux-unit-coverage. One instrumented build of the whole workspace and its tests: about an hour on a cold
  # cache.
  unit-coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    container:
      # archlinux:base-devel-20261011.0.609700
      image: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
      options: --privileged --init
    env:
      CARGO_TERM_COLOR: always
      ARCH_SNAPSHOT: "2026/10/14"
    steps:
      - name: system packages from the Arch Linux Archive snapshot
        run: |
          echo "Server = https://archive.archlinux.org/repos/$ARCH_SNAPSHOT/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          cat > /usr/local/bin/pacman-archive <<'EOF'
          #!/bin/bash
          # pacman-archive PKG...: the snapshot's upgrade and PKG..., downloaded with retries, installed from the cache
          set -u
          for attempt in 1 2 3; do
            if timeout --kill-after=1m 15m pacman -Syyuuw --needed --noconfirm --disable-download-timeout "$@"; then
              exec pacman -Suu --needed --noconfirm "$@"
            fi
            rm -f /var/lib/pacman/db.lck
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::download from the Arch Linux Archive failed (attempt $attempt of 3), retrying in 30s"
              sleep 30
            fi
          done
          echo "::error::download from the Arch Linux Archive failed 3 times: $*"
          exit 1
          EOF
          chmod +x /usr/local/bin/pacman-archive
          pacman-archive git rustup wpewebkit bubblewrap \
            meson ninja wayland wayland-protocols libxkbcommon libxcb \
            curl xz patch ncurses fontconfig ttf-dejavu procps-ng \
            weston dbus xorg-server-xvfb xorg-xauth mesa vulkan-swrast \
            pixman libinput libevdev libdrm cairo pango libpng hwdata seatd lcms2 \
            python zsh fish at-spi2-core gobject-introspection pkgconf gcc \
            gst-plugins-base gst-plugins-good nodejs
      - uses: actions/checkout@v7
      # the runner owns the workspace, the container runs as root: without this git refuses the checkout
      - name: git trusts the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: rust toolchain (rust-toolchain.toml) with llvm-tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ngterm/vendor
          key: vendor-ngterm-arch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/pins.env', 'build/patches/**', 'scripts/lib/native.sh') }}
      - name: libghostty-vt prefix
        run: scripts/build-ghostty-vt.sh
      - name: terminal fonts
        run: scripts/fetch-fonts.sh
      - name: weston with --fake-seat
        shell: bash
        run: |
          # the help read whole: `grep -q` leaving a pipe early would end weston with SIGPIPE under pipefail
          if ! grep -q -- --fake-seat <<<"$(weston --help 2>/dev/null || true)"; then
            echo "$(scripts/build-weston.sh)/bin" >> "$GITHUB_PATH"
          fi
      - name: lavapipe (the distribution's)
        run: scripts/fetch-lavapipe.sh
      # The tests run as an unprivileged user, as on a desktop and in the Ubuntu job: root writes into the read-only
      # directories ngterm-core's persistence tests count on to refuse a write. It owns the checkout and the job's home (the
      # toolchain, cargo's registry, the vendor prefixes), may use /dev/udmabuf (the external texture test, required
      # like the display tests) and gets the unprivileged user namespaces WebKit's bubblewrap sandbox needs, which the
      # runner's AppArmor restricts (docs/development.md > WebKit sandbox on Ubuntu) and root alone escapes.
      - name: an unprivileged test user
        shell: bash
        run: |
          useradd --create-home --shell /bin/bash tester
          chown -R tester: "$GITHUB_WORKSPACE" "$HOME"
          if [[ ! -c /dev/udmabuf ]]; then
            echo "::error::no /dev/udmabuf on kernel $(uname -r): the external texture test needs it"
            exit 1
          fi
          chmod a+rw /dev/udmabuf
          restrict=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -f "$restrict" ]]; then echo 0 > "$restrict"; fi
      # exits 1 on a failed test with the report written: the floors are still judged and the report kept below; the
      # environment kept whole (-m), HOME included, so the toolchain and the prefixes set up above are the ones used.
      # runuser's PAM session leaves the user a soft descriptor limit of 1024, too few for the tests: the script
      # raises it within the hard limit.
      - name: unit-test coverage
        env:
          GDK_BACKEND: x11
          NGTERM_REQUIRE_DISPLAY_TESTS: "1"
          NGTERM_REQUIRE_NODE_TESTS: "1"
        run: runuser -u tester -m -- xvfb-run -a dbus-run-session -- scripts/unit-coverage.sh unit-coverage
      - name: unit coverage floors
        if: ${{ !cancelled() && hashFiles('unit-coverage/summary.md') != '' }}
        run: >-
          python conformance/tools/check_coverage.py
          --summary unit-coverage/summary.md
          --floor scripts/unit-coverage-floor-linux.txt
      - name: report into the summary
        if: ${{ !cancelled() && hashFiles('unit-coverage/summary.md') != '' }}
        run: cat unit-coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-linux-unit-coverage
          path: unit-coverage/
          if-no-files-found: warn

  # The staged build under the suite (run-linux.sh: each instance on its own headless weston and session bus),
  # held by conformance/rust-passing.txt, once per login shell. Its HTML overlays run on WPE WebKit, which Ubuntu does
  # not package, so the jobs run in the wpe job's Arch container (the same digest and Arch Linux Archive snapshot),
  # privileged so WebKit's bubblewrap sandbox gets its user namespaces, with an init that reaps what the suite's
  # instances leave. The build renders on lavapipe only: scripts/fetch-lavapipe.sh finds the distribution's
  # (vulkan-swrast) and the harness makes it the only Vulkan driver; its weston gets --fake-seat
  # (scripts/build-weston.sh builds the pinned one where Arch's lacks it). The app and the harness read the password
  # database's login shell, never $SHELL:
  # - bash: the build claims `live-any-shell` (Live sessions in bash, a Rust-only extension) and every test requiring
  #   it must pass; the process tests (single instance, activation, the quit save on SIGTERM, privileges) run here
  #   again with the HTML overlays on.
  # - zsh and fish: upstream wraps a pane in zmx only for one of these login shells, so the build claims
  #   `live-sessions` too and the live tests run: `--must-pass live-sessions` (every test upstream holds to Live
  #   sessions) and `--must-pass live-any-shell`, and `--must-pass pages-survive` (the Rust-only parking of a page whose
  #   presenter went, whose tests need Live sessions).
  # - bash, zsh and fish: `--must-pass agent-chat` too (the Rust-only agent record and `ngtermctl agent` behind the
  #   Android chat view), `--must-pass kitty-clipboard` (a program's Rust-only Kitty clipboard protocol),
  #   `--must-pass agterm-peer` (the Rust-only attach of an upstream agterm Mac, whose tests reach a loopback sshd:
  #   openssh below) and `--must-pass shell-profiles` (the Rust-only shell profiles a pane runs in place of the login
  #   shell).
# - coverage: the zsh entry again on an instrumented build (run-linux.sh --coverage: cargo-llvm-cov and the toolchain's
#   llvm-tools), every layer, its report the desktop app's e2e line coverage on Linux (code_coverage.py e2e: the total,
#   its distance to 90% and the share markers exclude, per crate), judged by
#   conformance/coverage/e2e-floor-desktop-linux.txt (tools/check_coverage.py: the total and each crate) and nothing
#   else: instrumentation slows the app, so the ratchet stays the entries above. zsh, as its run is the widest: it runs
#   every test the bash one does, and the live tests besides (`live-sessions`). Its report (coverage/, traces/) is
#   uploaded as rust-linux-coverage-conformance, and coverage/ alone (lcov.info: what a merge and the gap lists read)
#   as e2e-coverage-desktop-linux.
  conformance:
    needs: linux
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: bash
            out: rust-linux
            must-pass: >-
              --must-pass live-any-shell --must-pass agent-chat --must-pass kitty-clipboard --must-pass agterm-peer
              --must-pass shell-profiles
          - shell: zsh
            out: rust-linux-zsh
            must-pass: >-
              --must-pass live-sessions --must-pass live-any-shell --must-pass agent-chat --must-pass pages-survive
              --must-pass kitty-clipboard --must-pass agterm-peer --must-pass shell-profiles
          - shell: fish
            out: rust-linux-fish
            must-pass: >-
              --must-pass live-sessions --must-pass live-any-shell --must-pass agent-chat --must-pass pages-survive
              --must-pass kitty-clipboard --must-pass agterm-peer --must-pass shell-profiles
          - shell: zsh
            out: rust-linux-coverage
            coverage: true
    container:
      # archlinux:base-devel-20261011.0.609700
      image: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
      options: --privileged --init
    env:
      CARGO_TERM_COLOR: always
      ARCH_SNAPSHOT: "2026/10/14"
    steps:
      - name: system packages from the Arch Linux Archive snapshot
        run: |
          echo "Server = https://archive.archlinux.org/repos/$ARCH_SNAPSHOT/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          cat > /usr/local/bin/pacman-archive <<'EOF'
          #!/bin/bash
          # pacman-archive PKG...: the snapshot's upgrade and PKG..., downloaded with retries, installed from the cache
          set -u
          for attempt in 1 2 3; do
            if timeout --kill-after=1m 15m pacman -Syyuuw --needed --noconfirm --disable-download-timeout "$@"; then
              exec pacman -Suu --needed --noconfirm "$@"
            fi
            rm -f /var/lib/pacman/db.lck
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::download from the Arch Linux Archive failed (attempt $attempt of 3), retrying in 30s"
              sleep 30
            fi
          done
          echo "::error::download from the Arch Linux Archive failed 3 times: $*"
          exit 1
          EOF
          chmod +x /usr/local/bin/pacman-archive
          pacman-archive git rustup wpewebkit bubblewrap \
            meson ninja wayland wayland-protocols libxkbcommon libxcb \
            curl xz patch ncurses fontconfig ttf-dejavu procps-ng \
            weston dbus xorg-server-xvfb mesa vulkan-swrast \
            pixman libinput libevdev libdrm cairo pango libpng hwdata seatd lcms2 \
            python zsh fish at-spi2-core gobject-introspection cairo pkgconf gcc openssh
      - uses: actions/checkout@v7
      # the runner owns the workspace, the container runs as root: without this git refuses the checkout, and
      # run-linux.sh reads the build's commit from it
      - name: git trusts the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ngterm/vendor
          key: vendor-ngterm-arch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/pins.env', 'build/patches/**', 'scripts/lib/native.sh') }}
      # the source the app's libghostty-vt is built from, with the stage's terminfo, themes and shell integration
      # (Ghostty's at the same pin)
      - name: libghostty-vt prefix
        run: scripts/build-ghostty-vt.sh
      - name: terminal fonts
        run: scripts/fetch-fonts.sh
      - name: weston with --fake-seat
        shell: bash
        run: |
          # the help read whole: `grep -q` leaving a pipe early would end weston with SIGPIPE under pipefail
          if ! grep -q -- --fake-seat <<<"$(weston --help 2>/dev/null || true)"; then
            echo "$(scripts/build-weston.sh)/bin" >> "$GITHUB_PATH"
          fi
      - name: lavapipe (the distribution's)
        run: scripts/fetch-lavapipe.sh
      - name: ${{ matrix.shell }} as the login shell
        shell: bash
        run: |
          usermod --shell "$(command -v ${{ matrix.shell }})" "$(id -un)"
          getent passwd "$(id -un)"
      # instance: forwarding, activation and the SIGTERM quit; privileges: the app, a Live pane and its session keep
      # the user's privileges while a page runs (with the system's wpewebkit its worker runs plainly here); quit:
      # SIGTERM within its deadline with Live sessions busy and pages open
      - name: the process tests with the HTML overlays
        if: matrix.shell == 'bash' && !matrix.coverage
        env:
          NGTERM_REQUIRE_DISPLAY_TESTS: "1"
        # live panes need ngterm-session and HTML overlays need ngterm-web beside the app; a gpui-only test run
        # builds neither sibling binary
        run: |
          cargo build -p ngterm-session --bin ngterm-session -p ngterm-wpe --bin ngterm-web
          cargo test -p ngterm-gpui --test instance --test privileges --test quit
      - name: install the suite
        run: |
          python -m venv /opt/suite
          /opt/suite/bin/pip install -e "conformance[linux-ui]"
      # Exits with the ratchet's status; check_ratchet.py lists the newly green ids in the job summary.
      - name: full suite under a ${{ matrix.shell }} login shell (protocol, cli, behaviors)
        if: ${{ !matrix.coverage }}
        env:
          PYTHON: /opt/suite/bin/python
        run: >-
          conformance/tools/run-linux.sh --out conformance/reports/${{ matrix.out }} --
          ${{ matrix.must-pass }}
      # On the stage the suite ran: the terminal surface draws its first frame, a page loads in WPE WebKit's sandbox,
      # and the title bar, the sidebar and the terminal draw one color, the theme's background, with the sidebar tint
      # washing the sidebar alone (screenshots of the maximized window, its weston started with --debug).
      - name: llvm-tools (coverage)
        if: matrix.coverage
        run: rustup component add llvm-tools
      - name: cargo-llvm-cov (coverage)
        if: matrix.coverage
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # The instrumented build under every layer. Only a run without a coverage report (exit 2) fails here: the ratchet
      # verdict (exit 1) is the entries above's to judge. Unsetting GITHUB_STEP_SUMMARY only keeps the ratchet checker's
      # own summary block out; the suite's report.md, appended below, still carries its ratchet verdict.
      - name: instrumented suite (coverage)
        if: matrix.coverage
        shell: bash
        env:
          PYTHON: /opt/suite/bin/python
        run: |
          status=0
          env -u GITHUB_STEP_SUMMARY conformance/tools/run-linux.sh --coverage \
            --out conformance/reports/${{ matrix.out }} || status=$?
          if ((status == 2)); then exit 2; fi
          echo "run-linux.sh exited $status (the ratchet is not judged here)"
      - name: coverage floors
        if: matrix.coverage
        run: >-
          /opt/suite/bin/python conformance/tools/check_coverage.py
          --summary conformance/reports/${{ matrix.out }}/coverage/summary.md
          --floor conformance/coverage/e2e-floor-desktop-linux.txt
      - name: upload the e2e coverage
        if: ${{ matrix.coverage && !cancelled() && hashFiles('conformance/reports/rust-linux-coverage/coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage-desktop-linux
          path: conformance/reports/${{ matrix.out }}/coverage/
          if-no-files-found: error
      - name: probes (terminal frame, web process, window chrome)
        if: matrix.shell == 'bash' && !matrix.coverage
        shell: bash
        run: |
          status=0
          for probe in ghostty_probe webkit_probe chrome_probe; do
            if ! /opt/suite/bin/python "conformance/tools/$probe.py" > "$RUNNER_TEMP/$probe.json"; then
              status=1
              # the summary is not in the job's log: a failed probe's report goes there too
              echo "::error::$probe failed"
              cat "$RUNNER_TEMP/$probe.json"
            fi
            {
              echo "### $probe"
              echo '```json'
              cat "$RUNNER_TEMP/$probe.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
      - name: report into the summary
        if: always()
        shell: bash
        run: |
          report=conformance/reports/${{ matrix.out }}/report.md
          if [[ -f "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.out }}-conformance
          # Includes per-test traces/ alongside the nodeid report.
          path: conformance/reports/${{ matrix.out }}/
          if-no-files-found: warn
