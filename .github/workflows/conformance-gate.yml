# Host-free checks on every PR: the harness self-tests and the catalog coverage gate. Nothing here launches an app.
# A change of Markdown alone runs nothing, except conformance/docs/, whose rust-build.md a self-test checks; nor does a
# change of the iOS app's sources alone (mobile/ios/), which neither the harness nor the catalog reads.
name: conformance-gate

on:
  pull_request:
    paths: ["**", "!**/*.md", "!mobile/ios/**", "conformance/docs/**"]
  push:
    branches: [main, "ci/**"]
    paths: ["**", "!**/*.md", "!mobile/ios/**", "conformance/docs/**"]

permissions:
  contents: read

# A push to a branch or a PR cancels that ref's older run. Main's runs each have their own group, so every commit on
# main keeps its gate result: a shared group would drop a waiting run for a newer one even without cancel-in-progress.
concurrency:
  group: conformance-gate-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: install the suite
        run: python -m pip install -e conformance
      - name: self-tests
        run: python -m pytest conformance/selftests
      - name: coverage gate
        run: python -m pytest conformance --coverage-gate
