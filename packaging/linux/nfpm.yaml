name: ngterm
arch: ${PACKAGE_ARCH}
platform: linux
version: ${PACKAGE_VERSION}
release: 1
maintainer: Nick Alie <nickalie@users.noreply.github.com>
description: Terminal with persistent sessions and agent integrations
homepage: https://github.com/nickalie/ngterm
license: MIT
# xz: nfpm's gzip default costs both packages 8 to 9 MB; every dpkg and rpm these packages install on reads xz.
deb:
  compression: xz
rpm:
  compression: xz
scripts:
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh
contents:
  - src: ${PACKAGE_ROOT}/
    dst: /opt/ngterm
    type: tree
  - src: /opt/ngterm/AppRun
    dst: /usr/bin/ngterm
    type: symlink
  - src: /opt/ngterm/usr/bin/ngtermctl
    dst: /usr/bin/ngtermctl
    type: symlink
  - src: /opt/ngterm/usr/bin/ngterm-session
    dst: /usr/bin/ngterm-session
    type: symlink
  - src: /opt/ngterm/usr/bin/ngterm-headless
    dst: /usr/bin/ngterm-headless
    type: symlink
  - src: packaging/linux/com.nickalie.ngterm.desktop
    dst: /usr/share/applications/com.nickalie.ngterm.desktop
  - src: resources/icons/hicolor/
    dst: /usr/share/icons/hicolor
    type: tree
  - src: packaging/linux/apparmor/ngterm-release
    dst: /etc/apparmor.d/ngterm-release
    type: config
overrides:
  deb:
    depends:
      - "libc6 (>= 2.39)"
      - "libstdc++6 (>= 13)"
      - libgcc-s1
      - bubblewrap
      - xdg-dbus-proxy
      - ca-certificates
      - libvulkan1
      - libegl1
      # dlopened by libepoxy (WebKit's and the runtime's), so no NEEDED entry names it
      - libgles2
      - libgl1
      - libglx0
      - libglvnd0
      - libx11-xcb1
      - libx11-6
      - libxcb1
      - libxcb-dri3-0
      - libasound2t64
      - libcom-err2
      - libdrm2
      - libexpat1
      - libfontconfig1
      - libfreetype6
      - libfribidi0
      - libgbm1
      - libgmp10
      - libgpg-error0
      - libharfbuzz0b
      - "libjack-jackd2-0 | libjack0"
      - libpipewire-0.3-0t64
      - libusb-1.0-0
      - libwayland-client0
      - libglib2.0-0t64
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb-xkb1
      - libelf1t64
      - libzstd1
      - liblzma5
      - libudev1
      - libwayland-server0
      - libwayland-egl1
      - libwayland-cursor0
      - libxext6
      - libxfixes3
      - libxi6
      - libxrender1
      - libxcb-shm0
      - libxcb-render0
      - libp11-kit0
      - libtasn1-6
      - zlib1g
    recommends:
      - "libwpewebkit-2.0-1 (>= 2.54)"
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-libav
      - gstreamer1.0-gl
      - gstreamer1.0-alsa
      - gstreamer1.0-pulseaudio
  rpm:
    depends:
      - "glibc >= 2.39"
      - bubblewrap
      - xdg-dbus-proxy
      - ca-certificates
      - "libstdc++.so.6(GLIBCXX_3.4.32)(64bit)"
      - "libgcc_s.so.1()(64bit)"
      - "libvulkan.so.1()(64bit)"
      - "libEGL.so.1()(64bit)"
      # dlopened by libepoxy (WebKit's and the runtime's), so no NEEDED entry names it
      - "libGLESv2.so.2()(64bit)"
      - "libGL.so.1()(64bit)"
      - "libGLX.so.0()(64bit)"
      - "libGLdispatch.so.0()(64bit)"
      - "libX11-xcb.so.1()(64bit)"
      - "libX11.so.6()(64bit)"
      - "libxcb.so.1()(64bit)"
      - "libxcb-dri3.so.0()(64bit)"
      - "libasound.so.2()(64bit)"
      - "libcom_err.so.2()(64bit)"
      - "libdrm.so.2()(64bit)"
      - "libexpat.so.1()(64bit)"
      - "libfontconfig.so.1()(64bit)"
      - "libfreetype.so.6()(64bit)"
      - "libfribidi.so.0()(64bit)"
      - "libgbm.so.1()(64bit)"
      - "libgmp.so.10()(64bit)"
      - "libgpg-error.so.0()(64bit)"
      - "libharfbuzz.so.0()(64bit)"
      - "libjack.so.0()(64bit)"
      - "libpipewire-0.3.so.0()(64bit)"
      - "libusb-1.0.so.0()(64bit)"
      - "libwayland-client.so.0()(64bit)"
      - "libglib-2.0.so.0()(64bit)"
      - "libgobject-2.0.so.0()(64bit)"
      - "libgio-2.0.so.0()(64bit)"
      - "libgmodule-2.0.so.0()(64bit)"
      - "libxkbcommon.so.0()(64bit)"
      - "libxkbcommon-x11.so.0()(64bit)"
      - "libxcb-xkb.so.1()(64bit)"
      - "libelf.so.1()(64bit)"
      - "libzstd.so.1()(64bit)"
      - "liblzma.so.5()(64bit)"
      - "libudev.so.1()(64bit)"
      - "libwayland-server.so.0()(64bit)"
      - "libwayland-egl.so.1()(64bit)"
      - "libwayland-cursor.so.0()(64bit)"
      - "libXext.so.6()(64bit)"
      - "libXfixes.so.3()(64bit)"
      - "libXi.so.6()(64bit)"
      - "libXrender.so.1()(64bit)"
      - "libxcb-shm.so.0()(64bit)"
      - "libxcb-render.so.0()(64bit)"
      - "libp11-kit.so.0()(64bit)"
      - "libtasn1.so.6()(64bit)"
      - "libz.so.1()(64bit)"
    recommends:
      - "libWPEWebKit-2_0-1 >= 2.54"
      - gstreamer-plugins-base
      - gstreamer-plugins-good
      - gstreamer-plugins-bad
      - gstreamer-plugins-libav
  archlinux:
    depends:
      - "wpewebkit>=2.54"
      - gst-plugins-base
      - gst-plugins-good
      - gst-plugins-bad
      - gst-libav
      - "glibc>=2.39"
      - "libstdc++.so=6-64"
      - "libgcc_s.so=1-64"
      - bubblewrap
      - xdg-dbus-proxy
      - ca-certificates
      - vulkan-icd-loader
      - libglvnd
      - libx11
      - libxcb
      - alsa-lib
      - e2fsprogs
      - libdrm
      - expat
      - fontconfig
      - freetype2
      - fribidi
      - mesa
      - gmp
      - libgpg-error
      - harfbuzz
      - "libjack.so=0-64"
      - libpipewire
      - libusb
      - wayland
      - glib2
      - libxkbcommon
      - libxkbcommon-x11
      - libelf
      - zstd
      - xz
      - systemd-libs
      - libxext
      - libxfixes
      - libxi
      - libxrender
      - p11-kit
      - libtasn1
      - zlib
