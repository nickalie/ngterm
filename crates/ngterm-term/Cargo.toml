[package]
name = "ngterm-term"
description = "ngterm's terminal pane core: libghostty-vt behind a lock, a PTY (ngterm-pty) or a live session's in-process attach, and an IO thread per pane, frames and events in its own types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["local"]
# Panes whose program runs on this machine: a PTY and its child, a live pane's in-process attach to its session, a
# launch, a HUD's painter. Without it the crate holds the pane fed by its embedder's byte stream alone
# (`Pane::stream`), with no PTY, session server or process table in its graph: a remote-only frontend's (Android,
# where ngterm-session does not build).
local = ["dep:ngterm-host", "dep:ngterm-pty", "dep:ngterm-session"]
# Reading the program's screen itself and sending only to the screen read (`Pane::active_screen`, `Pane::key_if`,
# `Pane::paste_if`): what a remote viewer answering an agent's dialog needs (ngterm-mobile), and no frontend else.
screen-read = []

[dependencies]
ngterm-core.workspace = true
ngterm-ghostty-vt.workspace = true
# the shell a command line runs through (`command_line`), shared with the hooks, custom commands and overlay job
ngterm-host = { workspace = true, optional = true }
# a pane's PTY and child (openpty, Windows' pseudoconsole) and the actor that moves its bytes
ngterm-pty = { workspace = true, optional = true }
# the live-launch inputs a live pane's host starts from, and the client library a live pane attaches through
ngterm-session = { workspace = true, optional = true }
# the OSC 5522 classifier decodes metadata and MIME lists as Ghostty does (strict, padded)
base64.workspace = true
bitflags.workspace = true
png.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# the PTY's foreground process group and input modes, the hostname, a non-blocking open of an input file
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# the hostname OSC 7 reports are matched against (`GetComputerNameW`, as Ghostty reads it)
windows-sys = { workspace = true, features = ["Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# whether a killed child is gone (`OpenProcess`, `GetExitCodeProcess`)
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[lints]
workspace = true
