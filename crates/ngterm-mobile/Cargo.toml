[package]
name = "ngterm-mobile"
description = "ngterm's mobile core: a remote-only viewer of ngterm machines over ssh (their live sessions, presentation and panes), exposed to Kotlin through UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# `cdylib`: the `libngterm_mobile.so` the Android app loads through JNA; `lib`: the crate's own tests and binary.
crate-type = ["lib", "cdylib"]

[[bin]]
# UniFFI's bindgen in library mode over the built `.so` (scripts/build-android.sh), which writes the Kotlin bindings.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The in-memory transport (`transport::fake`), for tests of this crate and its embedders.
fakes = []
# The `uniffi-bindgen` binary: UniFFI's CLI, kept out of the library the app ships.
bindgen = ["uniffi/cli"]

[dependencies]
# the panes' terminals, fed by their ssh channels (`Pane::stream`); no `local`: no PTY or session server here. By
# path, since the workspace entry keeps the default features its other users rely on and a member can't drop them.
ngterm-term = { path = "../ngterm-term", default-features = false, features = ["screen-read"] }
# the remote command lines desktop's Attach Remote runs (`remote::ssh`'s tails) and what the far `ngtermctl` answers
# to them (`remote::origin_replies`), with their strings
ngterm-core.workspace = true
ngterm-proto.workspace = true
# a session's id as the core's presentation client keys it
uuid.workspace = true
# the actor's current-thread runtime and `LocalSet`, its command queue and the channels' queues
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "macros"] }
# ssh: one connection per machine, exec channels, keys and host keys
russh.workspace = true
# wipes private key bytes once a connection has used them
zeroize.workspace = true
thiserror.workspace = true
uniffi.workspace = true
# the far `ngtermctl agent`'s NDJSON chat events and JSON catalog
serde_json.workspace = true

[dev-dependencies]
# block on the facade's async calls in tests
futures-lite.workspace = true
# New Session's waits on a paused clock
tokio = { workspace = true, features = ["test-util"] }
# a stand-in far `ngtermctl` the chat's remote lines are run against, and the scratch home, vendor root and stubs
# of scripts/setup-ios.sh's tests
tempfile.workspace = true

[lints]
workspace = true
