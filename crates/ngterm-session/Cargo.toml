[package]
name = "ngterm-session"
description = "ngterm's live-session server, on herdr's architecture: its wire, its endpoint, its lifecycle, its panes, its client and `SessionHost`, the live-launch inputs, the foreground job and the process table"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Taken from herdr (Apache-2.0) as code; NOTICE carries herdr's license.
license = "MIT AND Apache-2.0"

[dependencies]
# The live-launch inputs: the wrap configuration, the launch probe and the paths are the core's policy.
ngterm-core.workspace = true
# The live panes' terminal state and their PTYs (the job tests' shells too, tests/job.rs).
ngterm-ghostty-vt.workspace = true
ngterm-host.workspace = true
ngterm-pty.workspace = true
# The attach client's OSC 52 answers of its outer terminal.
base64.workspace = true
interprocess.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
# The effective user, whom the namespace directory must belong to; the server's session.
# The attach client's terminal: raw mode and the window size. The server's upkeep clock, which counts sleep.
rustix = { workspace = true, features = ["process", "termios", "time"] }
# The server's spawn: `close_range` in the Linux child, `posix_spawn` and the responsibility SPI on macOS, the reap;
# the password database's login shell; the job's signals; macOS's process table (`libproc`, `sysctl`, `getsid`).
libc.workspace = true
# The attach client's `SIGWINCH` watcher.
signal-hook.workspace = true

[target.'cfg(windows)'.dependencies]
# The pipe's SDDL, in the UTF-16 string type interprocess takes.
widestring.workspace = true
windows-sys = { workspace = true, features = [
    # the process table's command lines, environment blocks and WoW64 check (`NtQueryInformationProcess`)
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    # a further instance of a namespace's pipe, for an update handoff's replacement (`FILE_FLAG_*`, `PIPE_ACCESS_*`);
    # the ConPTY gate's module version (`GetFileVersionInfoW` is in `Win32_Storage_FileSystem` too)
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    # the process table's reads of another process's environment block (`ReadProcessMemory`)
    "Win32_System_Diagnostics_Debug",
    # the job table's process snapshot
    "Win32_System_Diagnostics_ToolHelp",
    # the login shell's App Execution Alias: its reparse point (`DeviceIoControl`, `FSCTL_GET_REPARSE_POINT`)
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    # the ConPTY gate: the module `CreatePseudoConsole` lives in (`GetModuleHandleExW`, `GetModuleFileNameW`)
    "Win32_System_LibraryLoader",
    # `PROCESS_BASIC_INFORMATION`, and the 32-bit strings of a WoW64 process's environment block
    "Win32_System_Kernel",
    "Win32_System_Pipes",
    # the host's native machine (`IsWow64Process2`), which the login shell's image must run on
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # the process table's argv split (`CommandLineToArgvW`)
    "Win32_UI_Shell",
] }
# The server's start from inside a job that refuses breakaway.
wmi.workspace = true

[dev-dependencies]
# The remote attach line the CLI tests run (`ngterm-core::remote::ssh`) takes the endpoint's wire type.
ngterm-proto.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# The lifecycle tests' jobs.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints]
workspace = true
