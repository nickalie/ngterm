[package]
name = "ngterm-wpe-client"
description = "Socket client for ngterm's Linux HTML overlay worker, with no WebKit dependency"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
async-channel.workspace = true
# `serde`: the worker's messages carry the input's modifiers and the pages' settings
bitflags = { workspace = true, features = ["serde"] }
libc.workspace = true
# the worker's transport (`worker`): a SOCK_SEQPACKET pair, descriptors passed with SCM_RIGHTS, sealed memfds, polls
rustix = { workspace = true, features = ["event", "fs", "net"] }
# the worker's messages, as JSON
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
ngterm-host = { workspace = true, features = ["fakes"] }
tempfile.workspace = true


[lints]
workspace = true
