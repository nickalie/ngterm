[package]
name = "ngterm-update"
description = "Verified GitHub release downloads and installation for ngterm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# A local release server and installation for tests of the updater and its callers; shipped builds never enable it.
fakes = []

[dependencies]
dunce.workspace = true
flate2.workspace = true
minisign-verify.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
ureq.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zstd.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
