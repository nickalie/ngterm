[package]
name = "ngterm-pty"
description = "ngterm's PTY layer on every OS: a child on a PTY (openpty, ConPTY) and herdr's PTY actor that moves its bytes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Taken from herdr (Apache-2.0) as code; NOTICE carries herdr's license.
license = "MIT AND Apache-2.0"

[dependencies]
# The PTY and the child: openpty on Unix, ConPTY on Windows (vendor/portable-pty, build/patches/portable-pty).
portable-pty.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# poll, the wake pipe, the master's descriptor flags, TIOCSWINSZ, waitid and killpg.
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# The child tree's kill-on-close job, the cancel of a blocked pipe read and the Ctrl+C its children inherit.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
