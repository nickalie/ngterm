[package]
name = "ngterm-gpui"
description = "ngterm's GPUI frontend: the ngterm binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "ngterm"
path = "src/main.rs"

[features]
default = ["html"]
# HTML overlays on WPE WebKit (ngterm-wpe, Linux), which needs a WPE WebKit at build and run time (README > WPE
# WebKit). Without it the core refuses every page; the Ubuntu CI jobs build that way.
html = ["dep:ngterm-wpe", "dep:gio"]

[dependencies]
ngterm-app.workspace = true
ngterm-core.workspace = true
ngterm-host.workspace = true
ngterm-proto.workspace = true
ngterm-server.workspace = true
# the live sessions' server: its `SessionHost`, the live-launch inputs and the update handoff
ngterm-session.workspace = true
ngterm-term.workspace = true
async-channel.workspace = true
cosmic-text.workspace = true
fancy-regex.workspace = true
futures-util.workspace = true
gpui-kit.workspace = true
image.workspace = true
notify.workspace = true
# text watermarks are written as PNG files the terminals' `background-image` reads
png.workspace = true
raw-window-handle.workspace = true
# the windows' saved frames (`window_frames.rs`)
serde.workspace = true
serde_json.workspace = true
# write_*_file: the screen file goes into a temporary directory of its own, as Ghostty's does
tempfile.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

# `_exit` after the orderly shutdown (`main.rs`), the SIGTERM quit (`signals.rs`)
[target.'cfg(unix)'.dependencies]
libc.workspace = true
signal-hook.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
# RandR: the X11 monitors a restored window is kept on (`monitors.rs` `display_rects`), which GPUI's one display per X
# screen spans; XKB: the keyboard-layout lock's groups on X11 (`input_source/linux/x11.rs`)
x11rb = { workspace = true, features = ["randr", "xkb"] }
zbus.workspace = true
ngterm-wpe = { workspace = true, optional = true }
# the default web browser a page hands off to, whatever the address's type (upstream's `SystemBrowser`): the gio the
# WPE host already links
gio = { workspace = true, optional = true }
gpui-pre-linux.workspace = true
netlink-packet-core.workspace = true
netlink-packet-route.workspace = true
netlink-sys.workspace = true
xkbcommon.workspace = true

# the status sounds by name (`status_sound.rs`): NSSound and NSBeep on macOS, PlaySoundW and MessageBeep on Windows;
# the keyboard-layout lock (`input_source/`): Text Input Source Services on macOS, the keyboard layout calls on Windows;
# the selection clipboard's private pasteboard on macOS (`terminal/selection_clipboard/macos.rs`)
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSSound", "NSGraphics", "NSPasteboard"] }
objc2-foundation = { workspace = true, features = ["NSString"] }
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFBase", "CFDictionary", "CFNumber", "CFString"] }

# the single instance's pipe (`instance/windows.rs`), owner-only like the control socket's, its SDDL in the UTF-16
# string type interprocess takes
[target.'cfg(windows)'.dependencies]
# the native key behind a key event (`terminal/input.rs`, our `gpui-pre-windows` patch)
gpui-pre-windows.workspace = true
interprocess.workspace = true
widestring.workspace = true
# beside the sounds and the layout calls: the instance pipe's flush and the foreground hand-over
# (`instance/windows.rs`), the quit on the console's events and the session's end (`signals/windows.rs`), the process's
# own end (`main.rs`), the window's minimized and maximized state (`window.rs`), the motion setting
# (`status_glyph.rs`), the relauncher's detached start (`live_runtime.rs`)
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
ngterm-host = { workspace = true, features = ["fakes"] }
gpui-kit = { workspace = true, features = ["test-support"] }
gpui-pre-wgpu.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# the global hotkey's and the keyboard layout's tests press their keys on a private Xvfb through XTEST
# (tests/global_hotkey.rs, tests/keyboard_layout.rs); the window test lays monitors out on one through RandR
# (tests/x11_window.rs)
x11rb = { workspace = true, features = ["randr", "xkb", "xtest"] }

# GPUI's headless renderer opens one GPU device per process, so the external texture cases run in a child process per
# Vulkan driver, which this harness starts (tests/external_texture/main.rs).
[[test]]
name = "external_texture"
path = "tests/external_texture/main.rs"
harness = false

# HTML pages end to end on the real WPE WebKit, which runs once per process: a child per Vulkan driver, each a plain
# process whose engine runs in a worker where WPE WebKit is vendored (tests/html_overlay/main.rs).
[[test]]
name = "html_overlay"
path = "tests/html_overlay/main.rs"
harness = false
required-features = ["html"]

# The app, its Live panes and their sessions keep the user's privileges while pages run (tests/privileges.rs).
[[test]]
name = "privileges"
path = "tests/privileges.rs"
required-features = ["html"]

# SIGTERM quits within its deadline with Live sessions busy and HTML pages open (tests/quit.rs).
[[test]]
name = "quit"
path = "tests/quit.rs"
required-features = ["html"]

[lints]
workspace = true
